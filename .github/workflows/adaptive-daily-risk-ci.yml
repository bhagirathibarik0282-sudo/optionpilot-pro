name: Adaptive Daily Risk CI

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  adaptive-daily-risk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx tsx test/adaptive-daily-risk-policy.test.ts
