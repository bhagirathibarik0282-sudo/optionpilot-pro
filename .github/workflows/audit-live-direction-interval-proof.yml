name: Audit Observed Candidate 30m Gross Availability

on:
  push:
    branches:
      - audit/live-direction-interval-proof-v1
    paths:
      - ".github/workflows/audit-live-direction-interval-proof.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read production observed candidate 30m gross evidence
        shell: bash
        run: |
          set -euo pipefail
          total=0
          for d in 2026-09-01 2026-09-02 2026-09-03 2026-09-04 2026-09-07 2026-09-08 2026-09-09 2026-09-10; do
            curl --fail --show-error --silent --location --retry 2 --retry-delay 1 --max-time 240 \
              "https://optionpilot-pro-v2-production.up.railway.app/api/research/h1-observed-candidate-30m-gross?symbol=NIFTY&date=${d}&from=09%3A15&to=15%3A30&scope=FULL" \
              -o "/tmp/gross-${d}.json"
            n=$(jq -r '.sampleCount // 0' "/tmp/gross-${d}.json")
            total=$((total+n))
            jq '{tradeDate:.request.tradeDate,ok,sampleCount,positiveCount,lossCount,positiveRatePct,averageGrossReturnPct,blockers,semantics,pricePolicy,horizonPolicy,affectsVerdict,affectsTelegram,affectsExecution}' "/tmp/gross-${d}.json"
          done
          echo "TOTAL_EXACT30M_SAMPLES=${total}"
