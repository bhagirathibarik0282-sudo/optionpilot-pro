name: Audit H1 Replay Coverage Proof

on:
  push:
    branches:
      - audit/live-direction-interval-proof-v1
    paths:
      - ".github/workflows/audit-live-direction-interval-proof.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify aligned production replay coverage after PR 553
        shell: bash
        run: |
          set -euo pipefail
          for d in 2026-09-07 2026-09-08 2026-09-09 2026-09-10; do
            curl --fail --show-error --silent --location --retry 2 --retry-delay 1 --max-time 180 \
              "https://optionpilot-pro-v2-production.up.railway.app/api/research/h1-replay?symbol=NIFTY&date=${d}&from=09%3A15&to=15%3A30&scope=CORE" \
              -o "/tmp/replay-${d}.json"
            jq -e '.ok == true and (.continuity.coveragePct >= 0) and (.continuity.coveragePct <= 100) and (.continuity.canonicalCoveragePct >= 0) and (.continuity.canonicalCoveragePct <= 100)' "/tmp/replay-${d}.json" >/dev/null
            jq '{tradeDate:.request.tradeDate, expectedBuckets:.continuity.expectedBuckets, observedMarkerBuckets:.continuity.observedMarkerBuckets, coveragePct:.continuity.coveragePct, canonicalArchiveBuckets:.continuity.canonicalArchiveBuckets, canonicalCoveragePct:.continuity.canonicalCoveragePct, missingBucketCount:(.continuity.missingBuckets|length), complete:.continuity.complete}' "/tmp/replay-${d}.json"
          done
