name: Audit Selector Policy Readiness 20260920

on:
  pull_request:
    paths:
      - ".github/workflows/audit-selector-policy-readiness-20260920.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Direction readiness from current production evidence
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://optionpilot-pro-v2-production.up.railway.app/api/research'
          URL="$BASE/h1-direction-response-research?symbol=NIFTY&dates=2026-08-31%2C2026-09-15%2C2026-09-16&from=09%3A15&to=15%3A30&scope=FULL"
          curl --fail --show-error --silent --location --retry 3 --retry-delay 2 --max-time 300 "$URL" -o /tmp/direction.json
          jq '{
            ok,
            productionImpact,
            replaySummaries: [.replaySummaries[] | {
              tradeDate,
              complete: .continuity.complete,
              missingBucketCount: (.continuity.missingBuckets | length)
            }],
            temporalHoldoutEvaluated: .research.safety.temporalHoldoutEvaluated,
            policySelectionRubricDefined: .research.safety.policySelectionRubricDefined,
            selectionRubricEvaluation: .research.selectionRubricEvaluation,
            thresholdOosEvidenceQuality: .research.thresholdOos.evidenceQuality,
            blockers: .research.blockers,
            safety
          }' /tmp/direction.json
          jq -e '
            .ok == true and
            .productionImpact == "NONE" and
            .safety.readOnly == true and
            .safety.thresholdSelected == false and
            .safety.thresholdPromoted == false and
            .safety.affectsSelector == false and
            .safety.affectsTelegram == false and
            .safety.affectsVerdict == false and
            .safety.affectsExecution == false and
            .safety.createsOrders == false and
            .safety.grantsPromotionAuthority == false and
            .safety.failClosed == true
          ' /tmp/direction.json >/dev/null

      - name: Discover recorded NIFTY DTE0 dates and evaluate readiness
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://optionpilot-pro-v2-production.up.railway.app/api/research'
          curl --fail --show-error --silent --location --retry 3 --retry-delay 2 --max-time 120             "$BASE/h1-theory-dates" -o /tmp/dates.json

          mapfile -t dates < <(jq -r '
            [.dates[]? | select(.symbol=="NIFTY") | .tradeDate] | unique | sort | .[]
          ' /tmp/dates.json)

          : > /tmp/dte0_dates.txt
          for D in "${dates[@]}"; do
            URL="$BASE/h1-replay?symbol=NIFTY&date=$D&from=09%3A15&to=15%3A30&scope=FULL"
            status=$(curl --show-error --silent --location --retry 2 --retry-delay 1 --max-time 180               -o "/tmp/replay-$D.json" -w '%{http_code}' "$URL")
            if [ "$status" != "200" ]; then
              continue
            fi
            if jq -e '
              .ok == true and
              .continuity.complete == true and
              ([.options[]? | select((.dte|tonumber?) == 0)] | length) > 0
            ' "/tmp/replay-$D.json" >/dev/null; then
              echo "$D" >> /tmp/dte0_dates.txt
            fi
          done

          echo "DISCOVERED_DTE0_DATES=$(paste -sd, /tmp/dte0_dates.txt)"
          count=$(wc -l < /tmp/dte0_dates.txt | tr -d ' ')
          echo "DISCOVERED_DTE0_COUNT=$count"

          if [ "$count" -ge 4 ]; then
            dates_csv=$(paste -sd, /tmp/dte0_dates.txt)
            encoded_dates=$(python -c 'import os,urllib.parse; print(urllib.parse.quote(os.environ["DATES"], safe=""))' DATES="$dates_csv")
            URL="$BASE/h1-dte0-multiday-oos?symbol=NIFTY&dates=$encoded_dates&from=09%3A15&to=15%3A30&scope=FULL"
            curl --fail --show-error --silent --location --retry 3 --retry-delay 2 --max-time 300 "$URL" -o /tmp/dte0.json
            jq '{
              ok,
              mode,
              productionImpact,
              requestedDayCount,
              usableDayCount,
              validationEligibleDayCount,
              readiness,
              calibrationDates,
              oosDates,
              blockers,
              safety
            }' /tmp/dte0.json
            jq -e '
              .productionImpact == "NONE" and
              .safety.readOnly == true and
              .safety.affectsSelector == false and
              .safety.affectsTelegram == false and
              .safety.affectsExecution == false and
              .safety.thresholdPromoted == false
            ' /tmp/dte0.json >/dev/null
          else
            jq -n --argjson count "$count" --rawfile dates /tmp/dte0_dates.txt '{
              ok:false,
              mode:"H1_DTE0_DISCOVERY_READINESS_AUDIT_V1",
              productionImpact:"NONE",
              discoveredUsableDte0DayCount:$count,
              minimumRequiredDte0Days:4,
              missingUsableDte0Days:(4-$count),
              discoveredDates:($dates | split("\n") | map(select(length>0))),
              blocker:"INSUFFICIENT_DTE0_DAYS_REQUIRE_4",
              thresholdPromoted:false,
              affectsSelector:false,
              affectsTelegram:false,
              affectsExecution:false
            }'
          fi

      - name: Greek timing evidence readiness
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://optionpilot-pro-v2-production.up.railway.app/api/research'
          curl --fail --show-error --silent --location --retry 3 --retry-delay 2 --max-time 120             "$BASE/h1-live-exact-greek-timing-history?limit=500" -o /tmp/greek.json
          jq '{
            ok,
            mode,
            productionImpact,
            persistKind,
            count,
            latestMinute: ([.records[]?.minuteBucket] | max // null),
            earliestMinute: ([.records[]?.minuteBucket] | min // null),
            symbols: ([.records[]?.symbol] | unique),
            nonFutureOptionCount: ([.records[]? | select(.optionFutureAtReceive == false)] | length),
            nonFutureUnderlyingCount: ([.records[]? | select(.underlyingFutureAtOptionReceive == false)] | length),
            optionAgeMs: {
              min: ([.records[]?.optionAgeMsAtReceive] | min // null),
              max: ([.records[]?.optionAgeMsAtReceive] | max // null)
            },
            underlyingSkewMs: {
              min: ([.records[]?.underlyingSkewMs] | min // null),
              max: ([.records[]?.underlyingSkewMs] | max // null)
            },
            safety
          }' /tmp/greek.json
          jq -e '
            .ok == true and
            .mode == "READ_ONLY_H1_LIVE_EXACT_GREEK_TIMING_HISTORY_V1" and
            .productionImpact == "NONE" and
            .safety.readOnly == true and
            .safety.policyRequired == false and
            .safety.thresholdAuthority == "NONE" and
            .safety.affectsSelector == false and
            .safety.affectsTelegram == false and
            .safety.affectsVerdict == false and
            .safety.affectsExecution == false and
            .safety.createsOrders == false and
            .safety.failClosed == true
          ' /tmp/greek.json >/dev/null

      - name: Exact depth evidence readiness
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://optionpilot-pro-v2-production.up.railway.app/api/research'
          curl --fail --show-error --silent --location --retry 3 --retry-delay 2 --max-time 120             "$BASE/h1-live-exact-depth-history?limit=500" -o /tmp/depth.json
          jq '{
            ok,
            mode,
            productionImpact,
            persistKind,
            count,
            latestMinute: ([.records[]?.minuteBucket] | max // null),
            symbols: ([.records[]?.symbol] | unique),
            nonnullBidQty: ([.records[]? | select(.bidQty != null)] | length),
            nonnullAskQty: ([.records[]? | select(.askQty != null)] | length),
            authorityValues: ([.records[]?.thresholdAuthority] | unique),
            observationalOnlyAll: ([.records[]?.observationalOnly] | all),
            safety
          }' /tmp/depth.json
          jq -e '
            .ok == true and
            .productionImpact == "NONE" and
            .safety.readOnly == true and
            .safety.prePolicy == true and
            .safety.thresholdAuthority == "NONE" and
            .safety.affectsSelector == false and
            .safety.affectsTelegram == false and
            .safety.affectsExecution == false and
            .safety.createsOrders == false and
            .safety.failClosed == true
          ' /tmp/depth.json >/dev/null

      - name: Guard audit-only boundary
        shell: bash
        run: |
          set -euo pipefail
          echo 'AUDIT_ONLY_NO_POLICY_SELECTION'
          echo 'AUDIT_ONLY_NO_POLICY_PROMOTION'
          echo 'NO_DB_MUTATION'
          echo 'NO_RAILWAY_MUTATION'
          echo 'NO_SELECTOR_AUTHORITY'
          echo 'NO_TELEGRAM_AUTHORITY'
          echo 'NO_KITE_ORDER_AUTHORITY'
