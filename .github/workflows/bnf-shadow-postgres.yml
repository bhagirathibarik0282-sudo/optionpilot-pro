name: BANKNIFTY isolated PostgreSQL
on:
  pull_request:
    branches: [production]
    paths:
      - 'bnf_shadow/**'
      - '.github/workflows/bnf-shadow-postgres.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bnf-shadow-pg-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  isolated-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install test-only dependencies
        run: python -m pip install -r bnf_shadow/requirements.txt pgserver==0.1.4
      - name: Core and input-source tests
        run: python -m unittest bnf_shadow.test_bnf_shadow bnf_shadow.test_snapshot_source bnf_shadow.test_depth_source bnf_shadow.test_iv_quality -v
      - name: Real PostgreSQL ownership, rollback and restart tests
        env:
          BNF_SHADOW_REAL_PG_TEST: '1'
        run: python -m unittest bnf_shadow.test_real_postgres -v
      - name: Existing-feed relay and Python boundary
        run: node --test bnf_shadow/test_feed_relay.mjs bnf_shadow/test_market_context.mjs
