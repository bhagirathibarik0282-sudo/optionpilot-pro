name: BNF SHADOW Trade Timeline Read-only CI
on:
  pull_request:
    paths:
      - 'bnf-shadow-trade-timeline-v1.ts'
      - 'bnf-shadow-trade-timeline-view-v1.ts'
      - 'recorded-dashboard-http.ts'
      - 'recorded-dashboard-view.ts'
      - 'business-dashboard-v1-view.ts'
      - 'test/bnf-shadow-trade-timeline-v1.test.ts'
      - 'test/bnf-shadow-trade-timeline-http-v1.test.ts'
      - 'test/bnf-shadow-timeline-browser-v1.test.ts'
      - '.github/workflows/bnf-shadow-trade-timeline-ci.yml'
      - 'bnf-shadow-health.ts'
      - 'bnf-shadow-host-runtime.ts'
      - 'bnf-shadow-daywise.ts'
      - 'bnf-shadow-daywise-view.ts'
      - 'dashboard-live-http.ts'
      - 'dashboard-live-view.ts'
      - 'bnf_shadow/**'
      - 'test/bnf-shadow-health.test.ts'
      - 'test/bnf-shadow-daywise-browser.test.ts'
      - 'bnf-shadow-page.ts'
      - 'screen-overview.ts'
      - 'test/bnf-shadow-page-browser.test.ts'
      - 'bnf-replay-archive.ts'
      - 'eod-drive-upload.ts'
      - 'scripts/optionpilot-service-supervisor.mjs'
      - 'test/bnf-replay-archive.test.ts'
jobs:
  owner-gated-trade-timeline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx tsx --test test/bnf-shadow-trade-timeline-v1.test.ts test/bnf-shadow-trade-timeline-http-v1.test.ts test/bnf-shadow-daywise.test.ts test/bnf-shadow-health.test.ts test/bnf-shadow-dashboard-status.test.ts test/recorded-dashboard-http.test.ts test/bnf-historical-panel-render-smoke-v1.test.ts bnf_shadow/test_host.mjs test/bnf-replay-archive.test.ts test/eod-drive-readback.test.ts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r bnf_shadow/requirements.txt
      - run: python -m unittest discover -s bnf_shadow -t . -p 'test_*.py'

  private-chromium-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Install isolated Chromium test harness
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: command -v google-chrome
      - name: Verify private owner flow using synthetic events only
        run: CHROME_BIN=/usr/bin/google-chrome npx tsx --test test/bnf-shadow-timeline-browser-v1.test.ts test/bnf-shadow-daywise-browser.test.ts test/bnf-shadow-page-browser.test.ts
