name: BNF SHADOW Trade Timeline Read-only CI
on:
  pull_request:
    paths:
      - 'bnf-shadow-trade-timeline-v1.ts'
      - 'bnf-shadow-trade-timeline-view-v1.ts'
      - 'recorded-dashboard-http.ts'
      - 'recorded-dashboard-view.ts'
      - 'business-dashboard-v1-view.ts'
      - 'test/bnf-shadow-trade-timeline-v1.test.ts'
      - 'test/bnf-shadow-trade-timeline-http-v1.test.ts'
      - '.github/workflows/bnf-shadow-trade-timeline-ci.yml'
jobs:
  owner-gated-trade-timeline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx tsx --test test/bnf-shadow-trade-timeline-v1.test.ts test/bnf-shadow-trade-timeline-http-v1.test.ts test/bnf-shadow-daywise.test.ts test/recorded-dashboard-http.test.ts test/bnf-historical-panel-render-smoke-v1.test.ts
