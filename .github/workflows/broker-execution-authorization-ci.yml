name: Broker Execution Authorization CI

on:
  pull_request:
    paths:
      - 'broker-execution-authorization.ts'
      - 'test/broker-execution-authorization.test.ts'
      - '.github/workflows/broker-execution-authorization-ci.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --import tsx --test test/broker-execution-authorization.test.ts
