name: Business Dashboard V1 CI

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  business-dashboard-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node --import tsx --test test/market-book-strike-comparison.test.ts test/dashboard-background-quotes.test.ts test/market-book.test.ts test/business-dashboard-v1.test.ts test/data-three-modes.test.ts test/data-reading-checklist.test.ts test/dashboard-refresh-mobile.test.ts test/dashboard-data-annex.test.ts
