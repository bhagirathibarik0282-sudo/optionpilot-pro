name: Business Shadow Foundation CI

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  business-shadow-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node --import tsx --test test/option-buyer-business-metrics-v1.test.ts
      - run: node --import tsx --test test/business-forward-journal-v1.test.ts
