name: Business Shadow Registry Adapter CI

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  business-shadow-registry-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node --import tsx --test test/business-shadow-registry-adapter-v1.test.ts
      - run: node --import tsx --test test/business-shadow-live-http-v1.test.ts
      - run: node --import tsx --test test/business-shadow-live-bridge-v1.test.ts
