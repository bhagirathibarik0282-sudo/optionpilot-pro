name: Candidate Ranking Shadow CI

on:
  pull_request:
    paths:
      - "candidate-ranking-shadow.ts"
      - "candidate-ranking-shadow-http.ts"
      - "research-router.ts"
      - "test/candidate-ranking-shadow.test.ts"
      - "test/candidate-ranking-shadow-http.test.ts"
      - "test/candidate-ranking-shadow-router-smoke.test.ts"
      - "test/candidate-ranking-shadow-tie-break.test.ts"
      - "test/candidate-ranking-shadow-historical-reject.test.ts"
      - ".github/workflows/candidate-ranking-shadow-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate-ranking-shadow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run candidate ranking shadow tests
        run: NODE_ENV=test node --import tsx --test test/candidate-ranking-shadow.test.ts test/candidate-ranking-shadow-http.test.ts test/candidate-ranking-shadow-router-smoke.test.ts test/candidate-ranking-shadow-tie-break.test.ts test/candidate-ranking-shadow-historical-reject.test.ts
