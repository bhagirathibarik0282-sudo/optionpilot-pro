name: Canonical Live Adapters CI

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  constituent-registry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node --import tsx --test test/canonical-constituent-token-registry.test.ts
      - run: node --import tsx --test test/canonical-constituent-startup-adapter.test.ts
      - run: node --import tsx --test test/canonical-official-index-universe-freeze.test.ts
      - run: node --import tsx --test test/canonical-official-universe-ingest.test.ts
      - run: node --import tsx --test test/canonical-heavyweight-sector-selection-policy.test.ts
      - run: node --import tsx --test test/canonical-selection-startup-bridge.test.ts
      - run: node --import tsx --test test/canonical-selection-websocket-config-adapter.test.ts
      - run: node --import tsx --test test/canonical-readonly-shadow-composition.test.ts
      - run: node --import tsx --test test/canonical-readonly-shadow-activation-boundary.test.ts
      - run: node --import tsx --test test/canonical-live-shadow-snapshot-source.test.ts
      - run: node --import tsx --test test/canonical-business-evidence-input-adapter.test.ts
      - run: node --import tsx --test test/canonical-business-deterministic-scoring.test.ts
      - run: node --import tsx --test test/canonical-normalized-family-support-producer.test.ts
      - run: node --import tsx --test test/canonical-fii-dii-official-context.test.ts
      - run: node --import tsx --test test/canonical-fii-dii-practical-ingest-v2.test.ts
      - run: node --import tsx --test test/canonical-fii-dii-live-practical-probe.test.ts
      - run: node --import tsx --test test/canonical-fii-dii-dashboard-context-adapter.test.ts
      - run: node --import tsx --test test/canonical-fii-dii-production-row.test.ts
      - run: node --import tsx --test test/canonical-seven-index-intelligence-freeze.test.ts
      - run: node --import tsx --test test/canonical-seven-index-live-source-probe.test.ts
      - run: node --import tsx --test test/canonical-seven-index-live-source-practical-probe.test.ts
      - run: node --import tsx --test test/canonical-seven-index-market-value-parser.test.ts
      - run: node --import tsx --test test/canonical-seven-index-market-value-live-practical.test.ts
      - run: node --import tsx --test test/h1-dynamic-readonly-live-chain.test.ts
      - run: node --import tsx --test test/canonical-constituent-live-component.test.ts
      - run: node --import tsx --test test/canonical-constituent-tick-store.test.ts
      - run: node --import tsx --test test/h1-live-exact-readonly-websocket-service.test.ts
      - run: node --import tsx --test test/canonical-shadow-snapshot-assembler.test.ts
