name: Canonical Live Business Publisher CI

on:
  pull_request:
    paths:
      - "canonical-live-business-publisher.ts"
      - "canonical-business-runtime-registry.ts"
      - "canonical-buyer-candidate-packet.ts"
      - "canonical-business-consumer.ts"
      - "test/canonical-live-business-publisher.test.ts"
      - ".github/workflows/canonical-live-business-publisher-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: NODE_ENV=test node --import tsx --test test/canonical-live-business-publisher.test.ts
