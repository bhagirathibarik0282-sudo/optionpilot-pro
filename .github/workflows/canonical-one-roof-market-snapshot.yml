name: Canonical One-Roof Market Snapshot CI

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  one-roof-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx tsx test/canonical-one-roof-market-snapshot.test.ts
      - run: node --import tsx --test test/execution-admission-ledger.test.ts
