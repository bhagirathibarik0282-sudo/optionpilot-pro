name: CAS Closing Memory CI
on:
  pull_request:
    paths: ['cas-closing-memory*.ts', 'db.ts', 'research-router.ts', 'server.ts', 'business-dashboard-v1-view.ts', 'test/cas-closing-memory*.ts', '.github/workflows/cas-closing-memory-ci.yml']
  push:
    branches: [main]
    paths: ['cas-closing-memory*.ts', 'db.ts', 'research-router.ts', 'server.ts', 'business-dashboard-v1-view.ts', 'test/cas-closing-memory*.ts', '.github/workflows/cas-closing-memory-ci.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: cas_test
          POSTGRES_PASSWORD: cas_test
          POSTGRES_DB: cas_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cas_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: NODE_ENV=test node --import tsx --test test/cas-closing-memory.test.ts test/cas-closing-memory-persistence.test.ts test/h1-cas-proxy.test.ts test/research-router-auth.test.ts
        env:
          CAS_MEMORY_TEST_DATABASE_URL: postgres://cas_test:cas_test@127.0.0.1:5432/cas_test
      - run: node scripts/optionpilot-guardrail-check.mjs
