name: OptionPilot Devil Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Railway production service must have Settings -> Wait for CI enabled.
# Railway then holds the GitHub autodeploy in WAITING state until this workflow finishes.
# Any failed GitHub workflow causes Railway to SKIP that deployment.
concurrency:
  group: optionpilot-devil-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  devil-gate:
    name: Devil Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Validate package.json
        run: node -e "JSON.parse(require('fs').readFileSync('package.json','utf8')); console.log('PASS package.json')"

      - name: Devil check - Telegram strict index isolation
        run: |
          node <<'NODE'
          const fs = require('fs');
          const contract = fs.readFileSync('telegram-card-contract.ts', 'utf8');
          const sender = fs.readFileSync('telegram-sender-v2.ts', 'utf8');
          const trigger = fs.readFileSync('message-trigger-engine.ts', 'utf8');
          const hook = fs.readFileSync('research-server-hook.ts', 'utf8');
          const live = fs.readFileSync('meaningful-live-telegram.ts', 'utf8');
          const eod = fs.readFileSync('eod-archive-job.ts', 'utf8');
          const required = [
            ['NIFTY routing', contract.includes('NIFTY: "NIFTY"')],
            ['BANKNIFTY routing', contract.includes('BANKNIFTY: "BANKNIFTY"')],
            ['SENSEX routing', contract.includes('SENSEX: "SENSEX"')],
            ['Strict isolation', contract.includes('strictIndexIsolation: true')],
            ['Cross-post off', contract.includes('crossPostAllowed: false')],
            ['Sender routing assertion', sender.includes('TELEGRAM_ROUTING_MISMATCH')],
            ['Duplicate guard', sender.includes('DUPLICATE_GUARD')],
            ['Meaningful change gate', trigger.includes('meaningfulChange')],
            ['Hysteresis gate', trigger.includes('HYSTERESIS_CONFIRMATION_NOT_MET')],
            ['Exact duplicate suppression', trigger.includes('EXACT_DUPLICATE_SUPPRESSED')],
            ['Live meaningful bridge installed', hook.includes('installMeaningfulLiveTelegramBridge()')],
            ['Live bridge fail-open', live.includes('bridge failed open')],
            ['Same-timestamp leadership guard', live.includes('LEAD_TIMESTAMP_TIE_UNRESOLVED')],
            ['No execution authority', live.includes('NOT TRADE EXECUTION')],
            ['Persistent narrative journal', live.includes('meaningful_narrative_event')],
            ['EOD narrative inclusion', eod.includes('meaningfulNarrativeEvents')],
          ];
          let failed = false;
          for (const [name, ok] of required) {
            console.log(`${ok ? 'PASS' : 'FAIL'}: ${name}`);
            if (!ok) failed = true;
          }
          if (failed) process.exit(1);
          NODE

      - name: Devil check - runtime wiring guards
        run: |
          npm run h1:wire:check
          npm run outcome:wire:check

      - name: Devil check - focused messaging tests
        run: |
          NODE_ENV=test node --import tsx --test \
            test/message-trigger-engine.test.ts \
            test/meaningful-market-narrative.test.ts \
            test/meaningful-live-telegram.test.ts \
            test/telegram-human-live-talk.test.ts \
            test/telegram-style-route.test.ts \
            test/immediate-expansion-telegram-runtime.test.ts \
            test/eod-archive-core.test.ts

      - name: Devil check - full regression suite
        run: npm test

      - name: Devil Gate PASS
        run: echo "DEVIL_GATE_PASS_RAILWAY_MAY_DEPLOY_IF_WAIT_FOR_CI_ENABLED"
