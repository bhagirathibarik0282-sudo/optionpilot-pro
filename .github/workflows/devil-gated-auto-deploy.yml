name: OptionPilot Devil Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Railway production service must have Settings -> Wait for CI enabled.
# Railway then holds the GitHub autodeploy in WAITING state until this workflow finishes.
# Any failed GitHub workflow causes Railway to SKIP that deployment.
concurrency:
  group: optionpilot-devil-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  devil-gate:
    name: Devil Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Validate package.json
        run: node -e "JSON.parse(require('fs').readFileSync('package.json','utf8')); console.log('PASS package.json')"

      - name: Devil check - Telegram strict index isolation
        run: |
          node <<'NODE'
          const fs = require('fs');
          const contract = fs.readFileSync('telegram-card-contract.ts', 'utf8');
          const sender = fs.readFileSync('telegram-sender-v2.ts', 'utf8');
          const trigger = fs.readFileSync('message-trigger-engine.ts', 'utf8');
          const hook = fs.readFileSync('research-server-hook.ts', 'utf8');
          const live = fs.readFileSync('meaningful-live-telegram.ts', 'utf8');
          const monitor = fs.readFileSync('meaningful-live-acceptance-monitor.ts', 'utf8');
          const eod = fs.readFileSync('eod-archive-job.ts', 'utf8');
          const required = [
            ['NIFTY routing', contract.includes('NIFTY: "NIFTY"')],
            ['BANKNIFTY routing', contract.includes('BANKNIFTY: "BANKNIFTY"')],
            ['SENSEX routing', contract.includes('SENSEX: "SENSEX"')],
            ['Strict isolation', contract.includes('strictIndexIsolation: true')],
            ['Cross-post off', contract.includes('crossPostAllowed: false')],
            ['Sender routing assertion', sender.includes('TELEGRAM_ROUTING_MISMATCH')],
            ['Duplicate guard', sender.includes('DUPLICATE_GUARD')],
            ['Meaningful change gate', trigger.includes('meaningfulChange')],
            ['Hysteresis gate', trigger.includes('HYSTERESIS_CONFIRMATION_NOT_MET')],
            ['Exact duplicate suppression', trigger.includes('EXACT_DUPLICATE_SUPPRESSED')],
            ['Live meaningful bridge installed', hook.includes('installMeaningfulLiveTelegramBridge()')],
            ['Acceptance monitor installed after live bridge', hook.indexOf('installMeaningfulLiveAcceptanceMonitor()') > hook.indexOf('installMeaningfulLiveTelegramBridge()')],
            ['Acceptance endpoint mounted', hook.includes('/api/research/meaningful-live-acceptance')],
            ['Acceptance monitor does not mutate Telegram', monitor.includes('changesTelegramPayload: false')],
            ['Acceptance monitor journal check', monitor.includes('POSTGRES_APP_STATE_LOG')],
            ['Owned live candidate bridge fails closed', live.includes('meaningfulBridgeFailureDisposition') && live.includes('disposition === "SUPPRESS"')],
            ['Same-timestamp leadership guard', live.includes('LEAD_TIMESTAMP_TIE_UNRESOLVED')],
            ['No execution authority', live.includes('affectsExecution: false') && live.includes('affectsVerdict: false')],
            ['Persistent narrative journal', live.includes('meaningful_narrative_event')],
            ['EOD narrative inclusion', eod.includes('meaningfulNarrativeEvents')],
          ];
          let failed = false;
          for (const [name, ok] of required) {
            console.log(`${ok ? 'PASS' : 'FAIL'}: ${name}`);
            if (!ok) failed = true;
          }
          if (failed) process.exit(1);
          NODE

      - name: Devil check - runtime wiring guards
        run: |
          npm run h1:wire:check
          npm run outcome:wire:check

      - name: Devil check - focused messaging tests
        run: |
          NODE_ENV=test node --import tsx --test \
            test/message-trigger-engine.test.ts \
            test/meaningful-market-narrative.test.ts \
            test/meaningful-live-telegram.test.ts \
            test/canonical-telegram-live-identity.test.ts \
            test/meaningful-live-acceptance-monitor.test.ts \
            test/telegram-human-live-talk.test.ts \
            test/telegram-style-route.test.ts \
            test/immediate-expansion-telegram-runtime.test.ts \
            test/eod-archive-core.test.ts

      - name: Devil check - full regression suite
        run: npm test

      - name: PR584 audit ATM premium-level invalidation evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pr584-atm
          BASE='https://optionpilot-pro-v2-production.up.railway.app/api/research/h1-replay'
          for SYMBOL in NIFTY SENSEX; do
            for DATE in 2026-09-07 2026-09-09 2026-09-15 2026-09-18; do
              OUT="/tmp/pr584-atm/${SYMBOL}-${DATE}.json"
              URL="${BASE}?symbol=${SYMBOL}&date=${DATE}&from=09%3A15&to=15%3A30&scope=CORE"
              if ! curl --fail --silent --show-error --location --retry 2 --retry-delay 2 --max-time 180 "$URL" -o "$OUT"; then
                printf '{"ok":false,"reason":"HTTP_FETCH_FAILED"}\n' > "$OUT"
              fi
            done
          done
          python <<'PY'
          import glob,json,math
          from datetime import datetime
          H=(15,30,60); SOURCES=("OPTION_PDL","OBSERVED_DAY_LOW")
          def pos(v):
              try:
                  if v is None or isinstance(v,bool): return None
                  x=float(v); return x if math.isfinite(x) and x>0 else None
              except: return None
          def n(v):
              try:
                  x=float(v); return x if math.isfinite(x) else None
              except: return None
          def tms(v):
              try:return datetime.fromisoformat(str(v).replace("Z","+00:00")).timestamp()*1000
              except:return None
          def truth(r): return str(r.get("truth_verdict") or "")=="TRUE"
          def key(r):
              e=str(r.get("expiry") or ""); k=pos(r.get("strike")); side=str(r.get("option_type") or "")
              return f"{e}|{k:g}|{side}" if e and k and side in ("CE","PE") else None
          def quant(xs,p):
              if not xs:return None
              xs=sorted(xs); z=(len(xs)-1)*p; lo=math.floor(z); hi=math.ceil(z)
              return round(xs[lo] if lo==hi else xs[lo]+(xs[hi]-xs[lo])*(z-lo),4)
          def bucket():
              return {"observationCount":0,"levelAvailableCount":0,"forwardCoveredCount":0,"stopObservedCount":0,"stopNotObservedCount":0,"dist":[]}
          agg={(sym,src,h):bucket() for sym in ("NIFTY","SENSEX") for src in SOURCES for h in H}
          usable=[]; unavailable=[]; atm_total={"NIFTY":0,"SENSEX":0}
          for p in sorted(glob.glob("/tmp/pr584-atm/*.json")):
              name=p.rsplit("/",1)[-1][:-5]; symbol,date=name.split("-",1); d=json.load(open(p))
              if not d.get("ok") or not isinstance(d.get("options"),list):
                  unavailable.append({"symbol":symbol,"date":date,"reason":d.get("reason") or "REPLAY_NOT_OK"}); continue
              rows=d["options"]; usable.append({"symbol":symbol,"date":date,"counts":d.get("counts")})
              by={}
              for r in rows:
                  k=key(r)
                  if k: by.setdefault(k,[]).append(r)
              for arr in by.values(): arr.sort(key=lambda r:tms(r.get("minute_bucket")) or 0)
              obs=[r for r in rows if truth(r) and n(r.get("atm_offset"))==0 and pos(r.get("ask")) and key(r) and tms(r.get("minute_bucket"))]
              atm_total[symbol]+=len(obs)
              for r in obs:
                  entry=pos(r.get("ask")); t0=tms(r.get("minute_bucket")); k=key(r)
                  for src in SOURCES:
                      level=pos(r.get("pdl") if src=="OPTION_PDL" else r.get("day_low"))
                      valid=level is not None and level<entry
                      for h in H:
                          x=agg[(symbol,src,h)]; x["observationCount"]+=1
                          if not valid: continue
                          x["levelAvailableCount"]+=1; x["dist"].append((entry-level)/entry*100)
                          fut=[]
                          for fr in by.get(k,[]):
                              ft=tms(fr.get("minute_bucket")); bid=pos(fr.get("bid"))
                              if ft is not None and t0<ft<=t0+h*60000 and truth(fr) and bid is not None: fut.append(bid)
                          if fut:
                              x["forwardCoveredCount"]+=1
                              if any(bid<=level for bid in fut): x["stopObservedCount"]+=1
                              else:x["stopNotObservedCount"]+=1
          summaries=[]
          for sym in ("NIFTY","SENSEX"):
              for src in SOURCES:
                  for h in H:
                      x=agg[(sym,src,h)]; ds=x.pop("dist")
                      covered=x["forwardCoveredCount"]; hits=x["stopObservedCount"]
                      summaries.append({"symbol":sym,"source":src,"horizonMinutes":h,**x,
                        "levelAvailabilityRate":round(x["levelAvailableCount"]/x["observationCount"],4) if x["observationCount"] else None,
                        "stopObservedShareOfCovered":round(hits/covered,4) if covered else None,
                        "minDistancePct":quant(ds,0),"medianDistancePct":quant(ds,.5),"p75DistancePct":quant(ds,.75),"maxDistancePct":quant(ds,1)})
          out={"version":"PR584_ATM_PREMIUM_LEVEL_AUDIT_V1","productionImpact":"NONE","usableReplays":usable,"unavailableReplays":unavailable,
               "atmTruthObservationCount":atm_total,"summaries":summaries,
               "safety":{"population":"ALL_TRUE_ATM_OBSERVATIONS_NOT_CANDIDATE_SET","sourceSelectionDecision":"NOT_SELECTED","thresholdPromoted":False,
                         "canonicalSelectorQualificationProven":False,"sourcePromotionAllowed":False,"observationIndependenceClaim":False,
                         "usesFutureDataForDecision":False,"futureDataUse":"DESCRIPTIVE_TOUCH_AUDIT_ONLY",
                         "affectsSelector":False,"affectsTelegram":False,"affectsExecution":False,"createsOrders":False,
                         "promotionBlockers":["ATM_POPULATION_NOT_CANONICAL_CANDIDATE_POPULATION","INVALIDATION_POLICY_NOT_VALIDATED"]}}
          json.dump(out,open("/tmp/pr584-atm/summary.json","w"),indent=2)
          print("PR584_ATM_AUDIT_JSON="+json.dumps(out,separators=(",",":")))
          assert usable
          assert sum(atm_total.values())>0
          assert out["safety"]["sourceSelectionDecision"]=="NOT_SELECTED"
          assert out["safety"]["sourcePromotionAllowed"] is False
          assert out["safety"]["affectsExecution"] is False
          PY

      - name: Upload PR584 ATM audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: pr584-atm-premium-level-audit
          path: /tmp/pr584-atm/summary.json
          retention-days: 7

      - name: Devil Gate PASS
        run: echo "DEVIL_GATE_PASS_RAILWAY_MAY_DEPLOY_IF_WAIT_FOR_CI_ENABLED"
