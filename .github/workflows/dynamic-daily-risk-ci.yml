name: Dynamic Daily Risk CI

on:
  pull_request:
    branches:
      - main
    paths:
      - dynamic-daily-risk-sizing.ts
      - test/dynamic-daily-risk-sizing.test.ts
      - .github/workflows/dynamic-daily-risk-ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-dynamic-daily-risk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run dynamic daily risk sizing tests
        run: node --import tsx --test test/dynamic-daily-risk-sizing.test.ts
