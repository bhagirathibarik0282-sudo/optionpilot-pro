name: Execution Action Planner CI

on:
  pull_request:
    branches:
      - automation-staging
      - main
    paths:
      - execution-action-planner.ts
      - test/execution-action-planner.test.ts
      - .github/workflows/execution-action-planner-ci.yml

permissions:
  contents: read

jobs:
  validate-action-planner:
    name: Validate execution action planner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run execution action planner devil tests
        run: node --import tsx --test test/execution-action-planner.test.ts
