name: Execution Kill Switch CI

on:
  pull_request:
    branches:
      - main
    paths:
      - execution-kill-switch.ts
      - test/execution-kill-switch.test.ts
      - .github/workflows/execution-kill-switch-ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-kill-switch:
    name: Validate execution kill switch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run execution kill switch devil tests
        run: node --import tsx --test test/execution-kill-switch.test.ts
