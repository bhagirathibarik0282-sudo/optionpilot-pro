name: Execution Reconciliation CI

on:
  pull_request:
    branches:
      - main
    paths:
      - broker-order-reconciliation.ts
      - test/broker-order-reconciliation.test.ts
      - .github/workflows/execution-reconciliation-ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconciliation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run broker reconciliation tests
        run: node --import tsx --test test/broker-order-reconciliation.test.ts
