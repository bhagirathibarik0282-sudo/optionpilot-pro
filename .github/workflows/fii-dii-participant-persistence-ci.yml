name: FII DII Participant Persistence CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'fii-dii-store.ts'
      - 'fii-dii-nse.ts'
      - 'fii-dii-daily-job.ts'
      - 'fii-dii-cash-catchup-runtime.ts'
      - 'fii-dii-cash-catchup-scheduler.ts'
      - 'research-server-hook.ts'
      - 'canonical-fii-dii-live-fetch-v3.ts'
      - 'test/canonical-fii-dii-live-fetch-v3.test.ts'
      - 'test/fii-dii-participant-store.test.ts'
      - 'test/fii-dii-participant-ingest.test.ts'
      - 'test/fii-dii-nse.test.ts'
      - 'test/fii-dii-cash-catchup-runtime.test.ts'
      - 'test/fii-dii-cash-catchup-scheduler.test.ts'
      - '.github/workflows/fii-dii-participant-persistence-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install runtime dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Focused FII/DII participant tests
        run: NODE_ENV=test node --import tsx --test test/fii-dii-participant-store.test.ts test/fii-dii-participant-ingest.test.ts test/fii-dii-nse.test.ts test/canonical-fii-dii-live-fetch-v3.test.ts test/fii-dii-cash-repair-job.test.ts test/fii-dii-cash-catchup-runtime.test.ts test/fii-dii-cash-catchup-scheduler.test.ts
      - name: Install TypeScript check tooling
        run: npm install --ignore-scripts --no-audit --no-fund --no-save --package-lock=false typescript@5.8.3 @types/node@22 @types/pg@8
      - name: TypeScript noEmit check
        run: ./node_modules/.bin/tsc --noEmit --allowImportingTsExtensions --target ES2022 --module NodeNext --moduleResolution NodeNext --lib ES2022,DOM --types node --skipLibCheck --esModuleInterop fii-dii-store.ts fii-dii-nse.ts canonical-fii-dii-live-fetch-v3.ts fii-dii-daily-job.ts fii-dii-cash-repair-job.ts fii-dii-cash-catchup-runtime.ts fii-dii-cash-catchup-scheduler.ts
