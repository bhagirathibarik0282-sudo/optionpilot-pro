name: FII DII Production Readback Proof CI

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  production-readback-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node --import tsx --test test/canonical-fii-dii-production-readiness-production-practical.test.ts
