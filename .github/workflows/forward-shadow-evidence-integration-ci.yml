name: Forward Shadow Evidence Integration CI

on:
  pull_request:
    branches: [main]
    paths:
      - forward-shadow-evidence-integration.ts
      - shadow-trade-evidence-recorder.ts
      - forward-shadow-test-harness.ts
      - test/forward-shadow-evidence-integration.test.ts
      - .github/workflows/forward-shadow-evidence-integration-ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: node --import tsx --test test/forward-shadow-evidence-integration.test.ts
