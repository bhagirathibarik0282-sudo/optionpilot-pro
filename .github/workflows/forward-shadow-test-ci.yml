name: Forward Shadow Test CI

on:
  pull_request:
    branches:
      - main
    paths:
      - forward-shadow-test-harness.ts
      - test/forward-shadow-test-harness.test.ts
      - .github/workflows/forward-shadow-test-ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-forward-shadow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run forward shadow harness tests
        run: node --import tsx --test test/forward-shadow-test-harness.test.ts
