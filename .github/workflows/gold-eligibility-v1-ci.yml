permissions:
  contents: read

jobs:
  gold-eligibility-devil-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npx --no-install tsx --test test/canonical-one-roof-market-snapshot.test.ts test/h1-exact-live-spot-direction-provider.test.ts test/h1-remaining-family-directional-attestor.test.ts test/h1-gold-peer-conflict-absent-producer-v1.test.ts test/h1-gold-horizon-provenance-contract-v1.test.ts test/h1-gold-eligibility-v1.test.ts test/h1-gold-evidence-source-registry-v1.test.ts test/h1-gold-evidence-adapter-v1.test.ts test/h1-gold-live-runtime-bridge-v1.test.ts test/h1-golden-shadow-candidate-v1.test.ts test/h1-golden-shadow-presentation-v1.test.ts test/h1-golden-shadow-frozen-cases-v1.test.ts test/h1-gold-promotion-firewall-v1.test.ts test/h1-gold-real-registry-firewall-integration-v1.test.ts test/h1-gold-forward-validation-v1.test.ts test/h1-golden-decision-card-v1.test.ts test/h1-golden-decision-telegram-preview-v1.test.ts
