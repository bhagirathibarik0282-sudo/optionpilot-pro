name: H1 Authority-Free Commentary CI

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  h1-authority-free-commentary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: NODE_ENV=test node --import tsx --test test/h1-authority-free-low-noise-commentary.test.ts test/telegram-sender-v2-env.test.ts
