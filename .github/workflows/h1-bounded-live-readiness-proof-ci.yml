name: H1 Bounded Live Readiness Proof CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-live-readiness-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify bounded one-shot H1 readiness proof
        run: NODE_ENV=test node --import tsx --test test/h1-bounded-live-readiness-proof.test.ts test/h1-market-open-acceptance-capture.test.ts
