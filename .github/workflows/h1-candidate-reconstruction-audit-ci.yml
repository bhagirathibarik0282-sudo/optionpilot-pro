name: H1 Candidate Reconstruction Audit CI
on:
  pull_request:
    paths:
      - 'h1-candidate-reconstruction-audit.ts'
      - 'research-server-hook.ts'
      - 'test/h1-candidate-reconstruction-audit.test.ts'
      - '.github/workflows/h1-candidate-reconstruction-audit-ci.yml'
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx tsx --test test/h1-candidate-reconstruction-audit.test.ts
