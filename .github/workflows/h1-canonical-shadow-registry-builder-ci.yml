name: H1 Canonical Shadow Registry Builder CI

on:
  pull_request:
    paths:
      - "h1-canonical-shadow-registry-builder.ts"
      - "test/h1-canonical-shadow-registry-builder.test.ts"
      - ".github/workflows/h1-canonical-shadow-registry-builder-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx tsx --test test/h1-canonical-shadow-registry-builder.test.ts
