name: H1 Context-Fused Commentary CI

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  context-fused-commentary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx tsx test/h1-context-fused-low-noise-commentary.test.ts
