name: H1 Exact Core Family Signal Adapter CI

on:
  pull_request:
    paths:
      - "h1-exact-core-family-signal-adapter.ts"
      - "h1-live-gate-evidence-assembler.ts"
      - "canonical-live-family-signal-registry.ts"
      - "canonical-normalized-family-support-producer.ts"
      - "test/h1-exact-core-family-signal-adapter.test.ts"
      - ".github/workflows/h1-exact-core-family-signal-adapter-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  devil-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: >-
          NODE_ENV=test node --import tsx --test
          test/h1-exact-core-family-signal-adapter.test.ts
          test/canonical-live-family-signal-registry.test.ts
