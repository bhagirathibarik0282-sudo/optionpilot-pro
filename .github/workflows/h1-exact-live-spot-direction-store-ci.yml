name: H1 Exact Live Spot Direction Store CI

on:
  pull_request:
    paths:
      - "h1-exact-live-spot-direction-store.ts"
      - "test/h1-exact-live-spot-direction-store.test.ts"
      - ".github/workflows/h1-exact-live-spot-direction-store-ci.yml"

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx tsx --test test/h1-exact-live-spot-direction-store.test.ts
