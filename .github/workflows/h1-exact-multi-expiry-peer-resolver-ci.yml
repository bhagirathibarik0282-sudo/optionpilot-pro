name: H1 Exact Multi Expiry Peer Resolver CI

on:
  pull_request:
    paths:
      - 'h1-exact-multi-expiry-peer-resolver.ts'
      - 'test/h1-exact-multi-expiry-peer-resolver.test.ts'
      - '.github/workflows/h1-exact-multi-expiry-peer-resolver-ci.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx tsx --test test/h1-exact-multi-expiry-peer-resolver.test.ts
