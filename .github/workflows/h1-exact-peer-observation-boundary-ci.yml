name: H1 Exact Peer Observation Boundary CI

on:
  pull_request:
    paths:
      - "h1-exact-peer-observation-boundary.ts"
      - "test/h1-exact-peer-observation-boundary.test.ts"
      - ".github/workflows/h1-exact-peer-observation-boundary-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx tsx --test test/h1-exact-peer-observation-boundary.test.ts
