name: H1 Exact Shadow Live Wiring CI

on:
  pull_request:
    paths:
      - 'h1-exact-shadow-live-service.ts'
      - 'kite-shadow-runtime-service.ts'
      - 'package.json'
      - 'test/h1-exact-shadow-live-service.test.ts'
      - 'test/kite-shadow-runtime-service.test.ts'
      - '.github/workflows/h1-exact-shadow-live-wiring-ci.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx tsx --test test/h1-exact-shadow-live-service.test.ts test/kite-shadow-runtime-service.test.ts
      - run: npm run start:h1-exact-shadow
        env:
          KITE_H1_EXACT_SHADOW_ENABLED: 'false'
