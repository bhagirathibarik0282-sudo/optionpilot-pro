name: H1 Gold Chase Exact Service Shadow Hook V1 CI

on:
  pull_request:
    paths:
      - "h1-exact-shadow-live-service.ts"
      - "h1-gold-chase-exact-service-shadow-hook-v1.ts"
      - "h1-gold-chase-exact-lineage-resolver-v1.ts"
      - "h1-gold-chase-exact-lineage-publisher-v1.ts"
      - "h1-gold-chase-same-process-shadow-runtime-v1.ts"
      - "test/h1-exact-shadow-live-service.test.ts"
      - "test/h1-gold-chase-exact-service-shadow-hook-v1.test.ts"
      - "test/h1-gold-chase-exact-lineage-resolver-v1.test.ts"
      - "test/h1-gold-chase-exact-lineage-publisher-v1.test.ts"
      - ".github/workflows/h1-gold-chase-exact-service-shadow-hook-v1-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npx --no-install tsx --test test/h1-gold-chase-exact-service-shadow-hook-v1.test.ts test/h1-gold-chase-exact-lineage-resolver-v1.test.ts test/h1-gold-chase-exact-lineage-publisher-v1.test.ts test/h1-exact-shadow-live-service.test.ts test/h1-gold-chase-same-process-shadow-runtime-v1.test.ts test/h1-live-selector-registry.test.ts
