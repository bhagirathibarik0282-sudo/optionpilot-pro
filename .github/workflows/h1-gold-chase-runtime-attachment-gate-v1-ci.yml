name: H1 Gold Chase Runtime Attachment Gate V1 CI

on:
  pull_request:
    paths:
      - 'h1-gold-chase-runtime-attachment-gate-v1.ts'
      - 'h1-gold-chase-research-bootstrap-v1.ts'
      - 'h1-gold-live-runtime-bridge-v1.ts'
      - 'h1-canonical-live-business-runtime-coordinator.ts'
      - 'h1-live-gate-evidence-assembler.ts'
      - 'h1-live-selector-registry.ts'
      - 'test/h1-gold-chase-runtime-attachment-gate-v1.test.ts'
      - '.github/workflows/h1-gold-chase-runtime-attachment-gate-v1-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'h1-gold-chase-runtime-attachment-gate-v1.ts'
      - 'h1-gold-chase-research-bootstrap-v1.ts'
      - 'h1-gold-live-runtime-bridge-v1.ts'
      - 'h1-canonical-live-business-runtime-coordinator.ts'
      - 'h1-live-gate-evidence-assembler.ts'
      - 'h1-live-selector-registry.ts'
      - 'test/h1-gold-chase-runtime-attachment-gate-v1.test.ts'
      - '.github/workflows/h1-gold-chase-runtime-attachment-gate-v1-ci.yml'

permissions:
  contents: read

jobs:
  same-process-approved-source-devil-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npx --no-install tsx --test test/h1-gold-chase-runtime-attachment-gate-v1.test.ts
