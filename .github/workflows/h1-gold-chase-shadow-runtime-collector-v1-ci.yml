name: H1 Gold Chase Shadow Runtime Collector V1 CI

on:
  pull_request:
    paths:
      - 'business-forward-journal-v1.ts'
      - 'business-forward-live-outcome-collector-v1.ts'
      - 'h1-gold-chase-live-outcome-bridge-v1.ts'
      - 'h1-gold-chase-calibration-persistence-v1.ts'
      - 'h1-gold-chase-research-bootstrap-v1.ts'
      - 'h1-gold-chase-shadow-runtime-collector-v1.ts'
      - 'test/h1-gold-chase-shadow-runtime-collector-v1.test.ts'
      - '.github/workflows/h1-gold-chase-shadow-runtime-collector-v1-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'business-forward-journal-v1.ts'
      - 'business-forward-live-outcome-collector-v1.ts'
      - 'h1-gold-chase-live-outcome-bridge-v1.ts'
      - 'h1-gold-chase-calibration-persistence-v1.ts'
      - 'h1-gold-chase-research-bootstrap-v1.ts'
      - 'h1-gold-chase-shadow-runtime-collector-v1.ts'
      - 'test/h1-gold-chase-shadow-runtime-collector-v1.test.ts'
      - '.github/workflows/h1-gold-chase-shadow-runtime-collector-v1-ci.yml'

permissions:
  contents: read

jobs:
  shadow-runtime-collector-devil-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npx --no-install tsx --test test/h1-gold-chase-shadow-runtime-collector-v1.test.ts
