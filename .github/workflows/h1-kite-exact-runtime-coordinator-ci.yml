name: H1 Kite Exact Runtime Coordinator CI

on:
  pull_request:
    paths:
      - 'h1-kite-exact-runtime-coordinator.ts'
      - 'h1-live-exact-market-wiring-readiness.ts'
      - 'h1-live-exact-readonly-websocket-service.ts'
      - 'h1-live-contract-selection-startup-audit.ts'
      - 'h1-dynamic-readonly-live-chain.ts'
      - 'test/h1-kite-exact-runtime-coordinator.test.ts'
      - 'test/h1-live-exact-market-wiring-readiness.test.ts'
      - 'test/h1-live-exact-readonly-websocket-service.test.ts'
      - 'test/h1-dynamic-readonly-live-chain.test.ts'
      - '.github/workflows/h1-kite-exact-runtime-coordinator-ci.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npx --no-install tsx --test test/h1-kite-exact-runtime-coordinator.test.ts test/h1-live-exact-market-wiring-readiness.test.ts test/h1-live-exact-readonly-websocket-service.test.ts test/h1-dynamic-readonly-live-chain.test.ts
