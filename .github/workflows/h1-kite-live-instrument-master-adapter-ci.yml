name: H1 Kite Live Instrument Master Adapter CI

on:
  pull_request:
    paths:
      - "h1-kite-live-instrument-master-adapter.ts"
      - "test/h1-kite-live-instrument-master-adapter.test.ts"
      - ".github/workflows/h1-kite-live-instrument-master-adapter-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx tsx --test test/h1-kite-live-instrument-master-adapter.test.ts
