name: H1 Kite Master Canonical Registry Bridge CI

on:
  pull_request:
    paths:
      - "h1-kite-master-canonical-registry-bridge.ts"
      - "test/h1-kite-master-canonical-registry-bridge.test.ts"
      - ".github/workflows/h1-kite-master-canonical-registry-bridge-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx tsx --test test/h1-kite-master-canonical-registry-bridge.test.ts
