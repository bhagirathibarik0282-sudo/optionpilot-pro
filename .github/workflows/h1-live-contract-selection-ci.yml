name: H1 Live Contract Selection CI

on:
  pull_request:
    paths:
      - 'h1-live-selection-spot-rest.ts'
      - 'h1-live-contract-selection.ts'
      - 'h1-live-contract-selection-startup-audit.ts'
      - 'h1-live-contract-discovery-startup-audit.ts'
      - 'h1-live-selection-exact-registry-preflight.ts'
      - 'test/h1-live-contract-selection.test.ts'
      - 'test/h1-live-selection-exact-registry-preflight.test.ts'
      - '.github/workflows/h1-live-contract-selection-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npx --no-install tsx --test test/h1-live-contract-selection.test.ts test/h1-live-selection-exact-registry-preflight.test.ts
