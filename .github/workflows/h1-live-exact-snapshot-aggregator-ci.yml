name: H1 Live Exact Snapshot Aggregator CI

on:
  pull_request:
    paths:
      - 'h1-live-exact-snapshot-aggregator.ts'
      - 'test/h1-live-exact-snapshot-aggregator.test.ts'
      - '.github/workflows/h1-live-exact-snapshot-aggregator-ci.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx tsx --test test/h1-live-exact-snapshot-aggregator.test.ts
