name: H1 Live Gate Readback Audit

on:
  pull_request:
    paths:
      - '.github/workflows/h1-live-gate-readback-audit-20260918.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-only-production-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fetch persisted live gate evidence
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://optionpilot-pro-v2-production.up.railway.app/api/research'
          curl --fail --show-error --silent --location --retry 3 --retry-delay 2 --max-time 120             "$BASE/h1-live-gate-evidence-history?limit=20" -o /tmp/gates.json
          python - <<'PY'
          import json,re
          p=json.load(open('/tmp/gates.json'))
          recs=p.get('records') or []
          targets=('premium','delta','gamma','theta','iv','dte','bid','ask','qty','depth','spread','peer','expiry')
          counts={}
          def walk(x,prefix=''):
              if isinstance(x,dict):
                  for k,v in x.items():
                      path=f'{prefix}.{k}' if prefix else k
                      lk=k.lower()
                      if any(t in lk for t in targets):
                          key=path
                          c=counts.setdefault(key,{'present':0,'nonnull':0})
                          c['present']+=1
                          if v is not None:
                              c['nonnull']+=1
                      walk(v,path)
              elif isinstance(x,list):
                  for i,v in enumerate(x):
                      walk(v,prefix+'[]')
          for r in recs: walk(r)
          print('LIVE_GATE_SUMMARY='+json.dumps({
              'ok':p.get('ok'),
              'mode':p.get('mode'),
              'persistKind':p.get('persistKind'),
              'count':p.get('count'),
              'fieldPresence':counts,
              'safety':p.get('safety')
          },separators=(',',':')))
          PY

      - name: Fetch today NIFTY replay depth readback
        shell: bash
        run: |
          set -euo pipefail
          URL='https://optionpilot-pro-v2-production.up.railway.app/api/research/h1-replay?symbol=NIFTY&date=2026-09-18&from=09%3A15&to=15%3A30&scope=CORE'
          status=$(curl --connect-timeout 15 --max-time 180 --retry 3 --retry-delay 2 -sS -o /tmp/replay.json -w '%{http_code}' "$URL")
          echo "REPLAY_HTTP_STATUS=$status"
          python - <<'PY'
          import json
          p=json.load(open('/tmp/replay.json'))
          rows=p.get('options') or []
          fields=['bid','ask','bid_qty','ask_qty','spread','dte','iv','delta','gamma','theta','expiry','option_type']
          summary={}
          for f in fields:
              summary[f]={
                  'presentRows':sum(1 for r in rows if isinstance(r,dict) and f in r),
                  'nonNullRows':sum(1 for r in rows if isinstance(r,dict) and r.get(f) is not None)
              }
          buckets=[r.get('minute_bucket') for r in rows if isinstance(r,dict) and r.get('minute_bucket')]
          print('REPLAY_DEPTH_SUMMARY='+json.dumps({
              'ok':p.get('ok'),
              'mode':p.get('mode'),
              'reason':p.get('reason'),
              'optionRowCount':len(rows),
              'firstObserved':min(buckets) if buckets else None,
              'lastObserved':max(buckets) if buckets else None,
              'fields':summary
          },separators=(',',':')))
          PY

      - name: Audit full replay multi-expiry theta iv
        shell: bash
        run: |
          set -euo pipefail
          URL='https://optionpilot-pro-v2-production.up.railway.app/api/research/h1-replay?symbol=NIFTY&date=2026-09-18&from=09%3A15&to=15%3A30&scope=FULL'
          curl --fail --show-error --silent --location --retry 3 --retry-delay 2 --max-time 180 "$URL" -o /tmp/full.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/full.json'))
          rows=p.get('options') or []
          expiries=sorted(set(str(r.get('expiry')) for r in rows if isinstance(r,dict) and r.get('expiry')))
          both={}
          for exp in expiries:
              subset=[r for r in rows if isinstance(r,dict) and str(r.get('expiry'))==exp]
              both[exp]={
                  'rows':len(subset),
                  'thetaNonNull':sum(1 for r in subset if r.get('theta') is not None),
                  'ivNonNull':sum(1 for r in subset if r.get('iv') is not None),
                  'ceRows':sum(1 for r in subset if r.get('option_type')=='CE'),
                  'peRows':sum(1 for r in subset if r.get('option_type')=='PE'),
              }
          groups={}
          for r in rows:
              if not isinstance(r,dict): continue
              minute=r.get('minute_bucket'); strike=r.get('strike'); side=r.get('option_type'); exp=r.get('expiry')
              if minute is None or strike is None or side not in ('CE','PE') or exp is None: continue
              key=(str(minute),str(strike),str(side))
              groups.setdefault(key,set()).add(str(exp))
          comparable=[len(v) for v in groups.values() if len(v)>=2]
          print('FULL_MULTIEXPIRY_GREEK_SUMMARY='+json.dumps({
              'ok':p.get('ok'),
              'mode':p.get('mode'),
              'optionRowCount':len(rows),
              'expiryCount':len(expiries),
              'expiries':expiries,
              'perExpiry':both,
              'comparableGroupCount':len(comparable),
              'groupsWith3Expiries':sum(1 for n in comparable if n>=3),
              'maxExpiryCountPerComparableGroup':max(comparable) if comparable else 0
          },separators=(',',':')))
          PY

      - name: Audit direction response and Greek carry diagnostics
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://optionpilot-pro-v2-production.up.railway.app/api/research'
          for D in 2026-09-01 2026-09-08 2026-09-15 2026-09-18; do
            curl --fail --show-error --silent --location --retry 3 --retry-delay 2 --max-time 180 \
              "$BASE/h1-replay?symbol=NIFTY&date=$D&from=09%3A15&to=15%3A30&scope=FULL" -o "/tmp/$D.json"
          done
          python - <<'PY'
          import json,math,statistics
          from collections import defaultdict
          dates=['2026-09-01','2026-09-08','2026-09-15','2026-09-18']
          def num(x):
              try:
                  y=float(x); return y if math.isfinite(y) else None
              except: return None
          def iso_ms(x):
              from datetime import datetime
              try:
                  return datetime.fromisoformat(str(x).replace('Z','+00:00')).timestamp()*1000
              except: return None
          def q(vals,p):
              vals=sorted(v for v in vals if v is not None and math.isfinite(v))
              if not vals:return None
              pos=(len(vals)-1)*p; lo=int(math.floor(pos)); hi=int(math.ceil(pos))
              return vals[lo] if lo==hi else vals[lo]+(vals[hi]-vals[lo])*(pos-lo)
          summaries={}
          all_moves=[]; all_agreements=[]
          carry=[]
          for D in dates:
              p=json.load(open('/tmp/'+D+'.json'))
              market=sorted([r for r in (p.get('market') or []) if r.get('minute_bucket')],key=lambda r:str(r.get('minute_bucket')))
              options=p.get('options') or []
              moves=[]
              for a,b in zip(market,market[1:]):
                  pa=num(a.get('spot_ltp')); pb=num(b.get('spot_ltp'))
                  ta=iso_ms(a.get('minute_bucket')); tb=iso_ms(b.get('minute_bucket'))
                  if pa and pb and ta is not None and tb is not None and tb>ta:
                      moves.append(((pb-pa)/pa*100,(tb-ta)))
              all_moves += [abs(x[0]) for x in moves]
              # same-contract premium response for current-expiry rows
              by_contract=defaultdict(list)
              for r in options:
                  exp=str(r.get('expiry') or '')
                  if not exp: continue
                  key=(exp,num(r.get('strike')),str(r.get('option_type')))
                  mb=iso_ms(r.get('minute_bucket')); ltp=num(r.get('ltp'))
                  if key[1] and key[2] in ('CE','PE') and mb is not None and ltp and ltp>0:
                      by_contract[key].append((mb,ltp))
              spot_move_by_to={}
              for mv,gap in moves:
                  # map through ordered market index below
                  pass
              market_pairs=[]
              for a,b in zip(market,market[1:]):
                  pa=num(a.get('spot_ltp')); pb=num(b.get('spot_ltp'))
                  ta=iso_ms(a.get('minute_bucket')); tb=iso_ms(b.get('minute_bucket'))
                  if pa and pb and ta is not None and tb is not None and tb>ta:
                      market_pairs.append((ta,tb,(pb-pa)/pa*100))
              agreement=[]
              for (exp,strike,side),arr in by_contract.items():
                  arr=sorted(arr)
                  amap={t:v for t,v in arr}
                  for ta,tb,sm in market_pairs:
                      if ta not in amap or tb not in amap: continue
                      pm=(amap[tb]-amap[ta])/amap[ta]*100
                      if sm==0 or pm==0: continue
                      expected=1 if side=='CE' else -1
                      ok=(1 if pm>0 else -1)==((1 if sm>0 else -1)*expected)
                      agreement.append((abs(sm),ok))
              all_agreements += agreement
              # put-call parity adjacent-strike carry estimates per minute+expiry
              spot_by_min={str(r.get('minute_bucket')):num(r.get('spot_ltp')) for r in market}
              grouped=defaultdict(dict)
              for r in options:
                  mb=str(r.get('minute_bucket') or ''); exp=str(r.get('expiry') or '')
                  k=num(r.get('strike')); side=str(r.get('option_type'))
                  bid=num(r.get('bid')); ask=num(r.get('ask')); ltp=num(r.get('ltp'))
                  px=((bid+ask)/2) if bid and ask and ask>bid else ltp
                  if mb and exp and k and side in ('CE','PE') and px and px>0:
                      grouped[(mb,exp,k)][side]=px
              parity=defaultdict(list)
              for (mb,exp,k),sides in grouped.items():
                  if 'CE' in sides and 'PE' in sides:
                      parity[(mb,exp)].append((k,sides['CE']-sides['PE']))
              from datetime import datetime,timezone,timedelta
              for (mb,exp),pts in parity.items():
                  pts=sorted(pts)
                  S=spot_by_min.get(mb)
                  if not S or len(pts)<2: continue
                  obs=datetime.fromisoformat(mb.replace('Z','+00:00'))
                  expdate=str(exp)[:10]
                  try:
                      close=datetime.fromisoformat(expdate+'T15:30:00+05:30').astimezone(timezone.utc)
                  except: continue
                  T=(close-obs).total_seconds()/(365*86400)
                  if T<=0: continue
                  for (k1,d1),(k2,d2) in zip(pts,pts[1:]):
                      if k2<=k1: continue
                      disc=(d1-d2)/(k2-k1)
                      if not (disc>0 and math.isfinite(disc)): continue
                      r=-math.log(disc)/T
                      # q from average of the two parity equations
                      vals=[]
                      for k,dv in ((k1,d1),(k2,d2)):
                          x=(dv+k*disc)/S
                          if x>0 and math.isfinite(x):
                              vals.append(-math.log(x)/T)
                      if vals:
                          carry.append((D,r,sum(vals)/len(vals)))
              summaries[D]={
                  'ok':p.get('ok'),
                  'marketRows':len(market),
                  'optionRows':len(options),
                  'spotMoveAbsP50':q([abs(x[0]) for x in moves],.5),
                  'spotMoveAbsP90':q([abs(x[0]) for x in moves],.9),
                  'spotMoveAbsP95':q([abs(x[0]) for x in moves],.95),
                  'directionResponseComparableCount':len(agreement),
                  'directionResponseAgreementRate':(sum(1 for _,ok in agreement if ok)/len(agreement)) if agreement else None
              }
          bins=[0.0,0.01,0.02,0.03,0.05,0.1,999]
          binout=[]
          for lo,hi in zip(bins,bins[1:]):
              xs=[ok for mag,ok in all_agreements if mag>=lo and mag<hi]
              binout.append({'fromPct':lo,'toPct':hi,'n':len(xs),'agreementRate':(sum(xs)/len(xs)) if xs else None})
          rates=[r for _,r,_ in carry if math.isfinite(r)]
          yields=[qv for _,_,qv in carry if math.isfinite(qv)]
          print('DIRECTION_GREEK_RESEARCH_AUDIT='+json.dumps({
              'mode':'RESEARCH_ONLY_NO_POLICY_PROMOTION',
              'dates':summaries,
              'combinedSpotMoveAbs':{'p50':q(all_moves,.5),'p90':q(all_moves,.9),'p95':q(all_moves,.95)},
              'directionAgreementBySpotMoveBin':binout,
              'carryObservationCount':len(carry),
              'impliedRateDescriptive':{'p10':q(rates,.1),'p50':q(rates,.5),'p90':q(rates,.9)},
              'impliedYieldDescriptive':{'p10':q(yields,.1),'p50':q(yields,.5),'p90':q(yields,.9)},
              'safety':{'productionImpact':'NONE','thresholdPromoted':False,'affectsSelector':False,'affectsTelegram':False,'affectsExecution':False}
          },separators=(',',':')))
          PY

      - name: Fetch pre-policy exact depth history
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --location --retry 3 --retry-delay 2 --max-time 120 \
            'https://optionpilot-pro-v2-production.up.railway.app/api/research/h1-live-exact-depth-history?limit=50' -o /tmp/depth.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/depth.json'))
          rows=p.get('records') or []
          print('PREPOLICY_DEPTH_SUMMARY='+json.dumps({
              'ok':p.get('ok'),
              'mode':p.get('mode'),
              'persistKind':p.get('persistKind'),
              'count':p.get('count'),
              'nonnullBidQty':sum(1 for r in rows if isinstance(r,dict) and r.get('bidQty') is not None),
              'nonnullAskQty':sum(1 for r in rows if isinstance(r,dict) and r.get('askQty') is not None),
              'symbols':sorted(set(str(r.get('symbol')) for r in rows if isinstance(r,dict) and r.get('symbol'))),
              'latestMinute':max((r.get('minuteBucket') for r in rows if isinstance(r,dict) and r.get('minuteBucket')), default=None),
              'authorityValues':sorted(set(str(r.get('thresholdAuthority')) for r in rows if isinstance(r,dict))),
              'observationalOnlyAll':all(r.get('observationalOnly') is True for r in rows if isinstance(r,dict)),
              'safety':p.get('safety')
          },separators=(',',':')))
          PY

      - name: Fetch live selector registry readback
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --location --retry 3 --retry-delay 2 --max-time 120             'https://optionpilot-pro-v2-production.up.railway.app/api/research/h1-live-selector-decisions' -o /tmp/selector.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/selector.json'))
          print('SELECTOR_READBACK_SUMMARY='+json.dumps({
              'ok':p.get('ok'),
              'mode':p.get('mode'),
              'registrySize':p.get('registrySize'),
              'selectCount':p.get('selectCount'),
              'blockCount':p.get('blockCount'),
              'responseMetricCount':len(p.get('responseMetrics') or []),
              'failClosed':p.get('failClosed')
          },separators=(',',':')))
          PY
