name: H1 Live PPD Supporting Evidence CI

on:
  pull_request:
    paths:
      - "h1-live-ppd-support-v1.ts"
      - "h1-live-gate-evidence-assembler.ts"
      - "h1-live-selector-registry.ts"
      - "test/h1-live-ppd-support-v1.test.ts"
      - "scripts/analyze-h1-ppd-replay.py"
      - "scripts/backtest-sep9-fused-candidates.py"
      - "scripts/backtest-fused-freshness-multiday.py"
      - "scripts/backtest-volume-fused-engine-7d.py"
      - ".github/workflows/h1-live-ppd-support-ci.yml"
  push:
    branches: [main]
    paths:
      - "h1-live-ppd-support-v1.ts"
      - "h1-live-gate-evidence-assembler.ts"
      - "h1-live-selector-registry.ts"
      - "test/h1-live-ppd-support-v1.test.ts"
      - "scripts/analyze-h1-ppd-replay.py"
      - "scripts/backtest-sep9-fused-candidates.py"
      - "scripts/backtest-fused-freshness-multiday.py"
      - "scripts/backtest-volume-fused-engine-7d.py"
      - ".github/workflows/h1-live-ppd-support-ci.yml"

permissions:
  contents: read

jobs:
  focused-ppd-support:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Focused live PPD supporting-evidence tests
        run: NODE_ENV=test node --import tsx --test test/h1-live-ppd-support-v1.test.ts test/h1-live-gate-evidence-assembler.test.ts test/h1-live-selector-decision-producer.test.ts test/execution-candidate-selector.test.ts

  sep9-nifty-ppd-replay-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Sep-9 NIFTY FULL replay read-only
        run: curl --fail --show-error --silent --location --retry 3 --retry-delay 2 --max-time 180 'https://optionpilot-pro-v2-production.up.railway.app/api/research/h1-replay?symbol=NIFTY&date=2026-09-09&from=09%3A15&to=15%3A30&scope=FULL' -o /tmp/nifty-sep9-full.json
      - name: Calculate exact 3m 6m 15m 30m PPD
        run: python scripts/analyze-h1-ppd-replay.py /tmp/nifty-sep9-full.json --output /tmp/nifty-sep9-ppd.json | tee /tmp/nifty-sep9-ppd-summary.log
      - name: Backtest selected fused candidates with exact MFE MAE
        run: python scripts/backtest-sep9-fused-candidates.py /tmp/nifty-sep9-full.json /tmp/nifty-sep9-fused-backtest.json | tee /tmp/nifty-sep9-fused-backtest.log
      - name: Fetch seven trading dates for all three indices
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/index7d
          for s in NIFTY SENSEX BANKNIFTY; do
            mkdir -p "/tmp/index7d/${s}"
            for d in 2026-09-01 2026-09-02 2026-09-03 2026-09-04 2026-09-07 2026-09-08 2026-09-09; do
              echo "FETCH ${s} ${d}"
              curl --fail --show-error --silent --location --retry 2 --retry-delay 1 --max-time 180 \
                "https://optionpilot-pro-v2-production.up.railway.app/api/research/h1-replay?symbol=${s}&date=${d}&from=09%3A15&to=15%3A30&scope=FULL" \
                -o "/tmp/index7d/${s}/${d}.json"
            done
          done
      - name: Backtest volume percent and deep fused option engine across three indices
        run: python scripts/backtest-volume-fused-engine-7d.py /tmp/index7d /tmp/volume-fused-7d.json | tee /tmp/volume-fused-7d.log
      - name: Safety and calculation devil check
        run: |
          python - <<'PY'
          import json
          r=json.load(open('/tmp/volume-fused-7d.json'))
          assert r['productionImpact']=='NONE'
          assert r['method']['noFutureLeakage'] is True
          assert r['method']['crossExpiryPremiumSubtraction'] is False
          assert r['method']['nearestTimestampSubstitution'] is False
          assert r['safety']=={'readOnly':True,'affectsSelector':False,'affectsTelegram':False,'affectsExecution':False,'failClosed':True}
          assert 'cumulative_volume(t)-cumulative_volume(t-w)' in r['method']['volumeRule']
          print('VOLUME_FUSED_7D_DEVIL_CHECK_PASS')
          PY
      - name: Upload numerical audit
        uses: actions/upload-artifact@v4
        with:
          name: volume-fused-7d-audit
          path: |
            /tmp/nifty-sep9-ppd.json
            /tmp/nifty-sep9-fused-backtest.json
            /tmp/volume-fused-7d.json
            /tmp/volume-fused-7d.log
          retention-days: 7
