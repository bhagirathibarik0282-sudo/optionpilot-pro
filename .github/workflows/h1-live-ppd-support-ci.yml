name: H1 Live PPD Supporting Evidence CI

on:
  pull_request:
    paths:
      - "h1-live-ppd-support-v1.ts"
      - "h1-live-gate-evidence-assembler.ts"
      - "h1-live-selector-registry.ts"
      - "test/h1-live-ppd-support-v1.test.ts"
      - "scripts/analyze-h1-ppd-replay.py"
      - "scripts/backtest-sep9-fused-candidates.py"
      - ".github/workflows/h1-live-ppd-support-ci.yml"
  push:
    branches: [main]
    paths:
      - "h1-live-ppd-support-v1.ts"
      - "h1-live-gate-evidence-assembler.ts"
      - "h1-live-selector-registry.ts"
      - "test/h1-live-ppd-support-v1.test.ts"
      - "scripts/analyze-h1-ppd-replay.py"
      - "scripts/backtest-sep9-fused-candidates.py"
      - ".github/workflows/h1-live-ppd-support-ci.yml"

permissions:
  contents: read

jobs:
  focused-ppd-support:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Focused live PPD supporting-evidence tests
        run: NODE_ENV=test node --import tsx --test test/h1-live-ppd-support-v1.test.ts test/h1-live-gate-evidence-assembler.test.ts test/h1-live-selector-decision-producer.test.ts test/execution-candidate-selector.test.ts

  sep9-nifty-ppd-replay-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Sep-9 NIFTY FULL replay read-only
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --location \
            --retry 3 --retry-delay 2 --max-time 180 \
            'https://optionpilot-pro-v2-production.up.railway.app/api/research/h1-replay?symbol=NIFTY&date=2026-09-09&from=09%3A15&to=15%3A30&scope=FULL' \
            -o /tmp/nifty-sep9-full.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/nifty-sep9-full.json'))
          print('REPLAY_OK', d.get('ok'))
          print('REPLAY_REASON', d.get('reason'))
          print('REPLAY_COUNTS', json.dumps(d.get('counts'), separators=(',',':')))
          assert d.get('ok') is True, d.get('reason')
          assert (d.get('counts') or {}).get('options',0) > 0, 'NO_OPTION_ROWS'
          PY
      - name: Calculate exact 3m 6m 15m 30m PPD
        run: python scripts/analyze-h1-ppd-replay.py /tmp/nifty-sep9-full.json --output /tmp/nifty-sep9-ppd.json | tee /tmp/nifty-sep9-ppd-summary.log
      - name: Backtest selected fused candidates with exact MFE MAE
        run: python scripts/backtest-sep9-fused-candidates.py /tmp/nifty-sep9-full.json /tmp/nifty-sep9-fused-backtest.json | tee /tmp/nifty-sep9-fused-backtest.log
      - name: Safety assertion
        run: |
          python - <<'PY'
          import json
          d=json.load(open('/tmp/nifty-sep9-ppd.json'))
          b=json.load(open('/tmp/nifty-sep9-fused-backtest.json'))
          assert d['productionImpact']=='NONE'
          assert d['safety']=={'readOnly': True, 'affectsSelector': False, 'affectsTelegram': False, 'affectsExecution': False, 'failClosed': True}
          assert d['method']['nearestTimestampSubstitution'] is False
          assert d['method']['crossExpiryPremiumSubtraction'] is False
          assert b['safety']=={'readOnly': True, 'affectsSelector': False, 'affectsTelegram': False, 'affectsExecution': False}
          print('PPD_REPLAY_SAFETY_PASS')
          print('FUSED_BACKTEST_SAFETY_PASS')
          PY
      - name: Upload numerical audit
        uses: actions/upload-artifact@v4
        with:
          name: nifty-sep9-ppd-audit
          path: |
            /tmp/nifty-sep9-ppd.json
            /tmp/nifty-sep9-ppd-summary.log
            /tmp/nifty-sep9-fused-backtest.json
            /tmp/nifty-sep9-fused-backtest.log
          retention-days: 7
