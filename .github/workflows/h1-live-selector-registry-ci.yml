name: H1 Live Selector Registry CI

on:
  pull_request:
    paths:
      - "h1-live-selector-registry.ts"
      - "test/h1-live-selector-registry.test.ts"
      - ".github/workflows/h1-live-selector-registry-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: NODE_ENV=test node --import tsx --test test/h1-live-selector-registry.test.ts
