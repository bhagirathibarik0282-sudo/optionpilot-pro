name: H1 Live Selector Source Audit CI

on:
  pull_request:
    paths:
      - "h1-live-selector-source-audit.ts"
      - "test/h1-live-selector-source-audit.test.ts"
      - ".github/workflows/h1-live-selector-source-audit-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run H1 live selector source audit tests
        run: NODE_ENV=test node --import tsx --test test/h1-live-selector-source-audit.test.ts
