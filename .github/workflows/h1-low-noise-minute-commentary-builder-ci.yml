name: H1 Low Noise Minute Commentary Builder CI

on:
  pull_request:
    paths:
      - 'h1-low-noise-minute-commentary-builder.ts'
      - 'test/h1-low-noise-minute-commentary-builder.test.ts'
      - '.github/workflows/h1-low-noise-minute-commentary-builder-ci.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx tsx --test test/h1-low-noise-minute-commentary-builder.test.ts
