name: H1 Observed Candidate 30m Breakdown CI
on:
  pull_request:
    paths:
      - 'h1-observed-candidate-30m-breakdown.ts'
      - 'test/h1-observed-candidate-30m-breakdown.test.ts'
      - '.github/workflows/h1-observed-candidate-30m-breakdown-ci.yml'
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx tsx --test test/h1-observed-candidate-30m-breakdown.test.ts
