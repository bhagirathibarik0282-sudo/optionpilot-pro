name: H1 Observed Candidate MDI Evidence HTTP CI
on:
  pull_request:
    paths:
      - 'h1-observed-candidate-mdi-evidence-http.ts'
      - 'research-server-hook.ts'
      - 'test/h1-observed-candidate-mdi-evidence-http.test.ts'
      - '.github/workflows/h1-observed-candidate-mdi-evidence-http-ci.yml'
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx tsx --test test/h1-observed-candidate-mdi-evidence-http.test.ts
