name: H1 Official Heavyweight Weight Authority CI

on:
  pull_request:
    paths:
      - "h1-official-heavyweight-weight-authority.ts"
      - "test/h1-official-heavyweight-weight-authority.test.ts"
      - "h1-live-seven-family-directional-producer.ts"
      - "test/h1-live-seven-family-directional-producer.test.ts"
      - ".github/workflows/h1-official-heavyweight-weight-authority-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  devil-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: >-
          NODE_ENV=test node --import tsx --test
          test/h1-official-heavyweight-weight-authority.test.ts
          test/h1-live-seven-family-directional-producer.test.ts
