name: H1 Option OI Derived Persistence CI

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  derived-option-oi-persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx tsx --test test/h1-option-oi-derived-persistence-contract.test.ts
