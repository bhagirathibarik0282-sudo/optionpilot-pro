name: H1 PPD Replay Audit

on:
  pull_request:
    paths:
      - 'scripts/analyze-h1-ppd-replay.py'
      - '.github/workflows/h1-ppd-replay-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sep9-nifty-ppd:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Sep-9 NIFTY FULL replay read-only
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --location \
            --retry 3 --retry-delay 2 --max-time 180 \
            'https://optionpilot-pro-v2-production.up.railway.app/api/research/h1-replay?symbol=NIFTY&date=2026-09-09&from=09%3A15&to=15%3A30&scope=FULL' \
            -o /tmp/nifty-sep9-full.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/nifty-sep9-full.json'))
          print('REPLAY_OK', d.get('ok'))
          print('REPLAY_COUNTS', json.dumps(d.get('counts'), separators=(',',':')))
          assert d.get('ok') is True
          assert (d.get('counts') or {}).get('options',0) > 0
          chain=d.get('chain') or []
          print('CHAIN_ROW_COUNT', len(chain))
          targets={'04:12','04:21','04:30','04:42','06:33','07:06','07:12','09:36'}
          fields=['minute_bucket','expiry','expiry_bucket','atm_strike','full_chain_oi_pcr','band7_oi_pcr','volume_pcr','call_wall_strike','call_wall_oi','call_wall_strength','call_wall_distance','call_wall_migration','put_wall_strike','put_wall_oi','put_wall_strength','put_wall_distance','put_wall_migration','max_pain','atm_iv','straddle_ltp','straddle_change','truth_verdict','validation_status']
          for row in chain:
            ts=str(row.get('minute_bucket') or '')
            hm=ts[11:16] if len(ts)>=16 else ''
            if hm in targets:
              print('POSITION_TARGET', json.dumps({k:row.get(k) for k in fields}, separators=(',',':'), default=str))
          PY

      - name: Calculate exact 3m 6m 15m 30m PPD
        run: |
          python scripts/analyze-h1-ppd-replay.py /tmp/nifty-sep9-full.json --output /tmp/nifty-sep9-ppd.json | tee /tmp/nifty-sep9-ppd-summary.log

      - name: Safety assertion
        run: |
          python - <<'PY'
          import json
          d=json.load(open('/tmp/nifty-sep9-ppd.json'))
          assert d['productionImpact']=='NONE'
          assert d['safety']=={'readOnly': True, 'affectsSelector': False, 'affectsTelegram': False, 'affectsExecution': False, 'failClosed': True}
          assert d['method']['nearestTimestampSubstitution'] is False
          assert d['method']['crossExpiryPremiumSubtraction'] is False
          print('PPD_REPLAY_SAFETY_PASS')
          PY

      - name: Upload numerical audit
        uses: actions/upload-artifact@v4
        with:
          name: nifty-sep9-ppd-audit
          path: |
            /tmp/nifty-sep9-ppd.json
            /tmp/nifty-sep9-ppd-summary.log
          retention-days: 7
