name: H1 PPD Winner False Window Comparison CI
on:
  pull_request:
    paths:
      - 'h1-ppd-winner-false-window-comparison-v1.ts'
      - 'test/h1-ppd-winner-false-window-comparison-v1.test.ts'
      - '.github/workflows/h1-ppd-winner-false-window-comparison-ci.yml'
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx tsx --test test/h1-ppd-winner-false-window-comparison-v1.test.ts
