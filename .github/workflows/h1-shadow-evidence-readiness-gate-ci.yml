name: H1 Shadow Evidence Readiness Gate CI

on:
  pull_request:
    paths:
      - 'h1-shadow-evidence-readiness-gate.ts'
      - 'test/h1-shadow-evidence-readiness-gate.test.ts'
      - '.github/workflows/h1-shadow-evidence-readiness-gate-ci.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx tsx --test test/h1-shadow-evidence-readiness-gate.test.ts
