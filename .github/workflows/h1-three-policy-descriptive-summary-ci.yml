name: H1 Three Policy Descriptive Summary CI

on:
  pull_request:
    paths:
      - "h1-three-policy-descriptive-summary-v1.ts"
      - "h1-three-policy-descriptive-summary-http-v1.ts"
      - "research-server-hook.ts"
      - "test/h1-three-policy-descriptive-summary-v1.test.ts"
      - ".github/workflows/h1-three-policy-descriptive-summary-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  summary:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: NODE_ENV=test node --import tsx --test test/h1-three-policy-descriptive-summary-v1.test.ts
      - name: Authority devil check
        run: |
          node <<'NODE'
          const fs = require('fs');
          const source = fs.readFileSync('h1-three-policy-descriptive-summary-v1.ts', 'utf8');
          const http = fs.readFileSync('h1-three-policy-descriptive-summary-http-v1.ts', 'utf8');
          const required = [
            'validationDecision: null',
            'acceptanceCriteriaApplied: false',
            'productionPromotionEligible: false',
            'affectsSelector: false',
            'affectsBusinessCard: false',
            'affectsTelegram: false',
            'affectsExecution: false',
            'createsOrders: false',
          ];
          for (const token of required) {
            if (!source.includes(token)) throw new Error(`missing authority guard: ${token}`);
          }
          if (!http.includes('rawRecordsReturned: false')) throw new Error('raw record exposure guard missing');
          if (!http.includes('thresholdsInvented: false')) throw new Error('threshold invention guard missing');
          NODE
