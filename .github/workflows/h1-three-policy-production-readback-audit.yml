name: H1 Untouched Capture Production Readback Audit

on:
  pull_request:
    paths:
      - ".github/workflows/h1-three-policy-production-readback-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Fetch production read-only evidence
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://optionpilot-pro-v2-production.up.railway.app'
          curl --fail --show-error --silent --location \
            --retry 3 --retry-delay 2 --max-time 60 \
            "$BASE/api/research/h1-kite-greek-math-crosscheck-history?limit=500" \
            -o /tmp/greek-history.json
          curl --fail --show-error --silent --location \
            --retry 3 --retry-delay 2 --max-time 60 \
            "$BASE/api/storage/health" \
            -o /tmp/storage-health.json

      - name: Verify authority boundaries and print exact capture proof
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from collections import Counter
          from datetime import datetime, timezone

          FREEZE = datetime.fromisoformat("2026-09-22T03:45:00+00:00")

          def dt(value):
              if not isinstance(value, str):
                  return None
              try:
                  return datetime.fromisoformat(value.replace("Z", "+00:00"))
              except Exception:
                  return None

          h = json.load(open("/tmp/greek-history.json"))
          assert h.get("ok") is True, h
          assert h.get("mode") == "READ_ONLY_H1_KITE_GREEK_MATH_CROSSCHECK_HISTORY_V1"
          assert h.get("persistKind") == "H1_KITE_GREEK_MATH_CROSSCHECK_1M_V1"
          assert h.get("productionImpact") == "NONE"
          s = h.get("safety") or {}
          assert s.get("readOnly") is True
          assert s.get("policySemantics") == "SHADOW_CALIBRATION_ONLY"
          assert s.get("thresholdAuthority") == "NONE"
          for key in ("affectsSelector","affectsBusinessCard","affectsTelegram","affectsVerdict","affectsExecution","createsOrders"):
              assert s.get(key) is False, (key, s.get(key))

          rows = h.get("records") or []
          post = []
          for r in rows:
              bucket = dt(r.get("minuteBucket"))
              if bucket is not None and bucket >= FREEZE:
                  post.append(r)

          symbols = Counter()
          tokens = set()
          with_direction = 0
          ready = 0
          buckets = []
          for r in post:
              token = r.get("instrumentToken")
              if isinstance(token, int):
                  tokens.add(token)
              ev = r.get("evidence") or {}
              symbol = ev.get("symbol")
              if isinstance(symbol, str):
                  symbols[symbol] += 1
              if ev.get("ready") is True:
                  ready += 1
              if (
                  r.get("directionSourceId") == "H1_EXACT_LIVE_SPOT_DIRECTION_PROVIDER_V1"
                  and r.get("selectorDirectionAtCapture") in ("UP","DOWN")
                  and r.get("expectedPremiumDirectionAtCapture") in ("UP","DOWN")
              ):
                  with_direction += 1
              b = dt(r.get("minuteBucket"))
              if b is not None:
                  buckets.append(b)

          capture = {
              "state": "CAPTURE_PRESENT" if post else "NO_POST_FREEZE_ROWS_IN_LAST_500",
              "apiReturnedRows": len(rows),
              "postFreezeRowsInReturnedWindow": len(post),
              "readyRows": ready,
              "directionLinkedRows": with_direction,
              "uniqueOptionTokens": len(tokens),
              "bySymbol": dict(symbols),
              "earliestPostFreezeMinuteBucket": min(buckets).isoformat() if buckets else None,
              "latestPostFreezeMinuteBucket": max(buckets).isoformat() if buckets else None,
              "freezeAt": FREEZE.isoformat(),
          }
          print("UNTOUCHED_CAPTURE_PROOF="+json.dumps(capture, separators=(",",":"), sort_keys=True))

          st = json.load(open("/tmp/storage-health.json"))
          assert st.get("dbConnected") is True, st
          assert st.get("readOnly") is True
          assert st.get("affectsVerdict") is False
          assert st.get("affectsTelegram") is False
          assert st.get("affectsExecution") is False
          storage = {
              "status": st.get("status"),
              "generatedAt": st.get("generatedAt"),
              "counts": st.get("counts"),
              "latest": st.get("latest"),
              "latestAgeMinutes": st.get("latestAgeMinutes"),
          }
          print("STORAGE_V3_PROOF="+json.dumps(storage, separators=(",",":"), sort_keys=True))
          PY

      - name: Guard audit-only boundary
        shell: bash
        run: |
          set -euo pipefail
          echo AUDIT_ONLY
          echo NO_THRESHOLD_SELECTION
          echo NO_POLICY_PROMOTION
          echo NO_DB_WRITE
          echo NO_RAILWAY_MUTATION
          echo NO_SELECTOR_MUTATION
          echo NO_BUSINESS_CARD_MUTATION
          echo NO_TELEGRAM_MUTATION
          echo NO_EXECUTION_OR_ORDER_MUTATION
