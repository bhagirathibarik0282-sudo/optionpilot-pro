name: H1 Three Policy Production Readback Audit

on:
  pull_request:
    paths:
      - ".github/workflows/h1-three-policy-production-readback-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch production evidence read-only
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --location \
            --retry 3 --retry-delay 2 --max-time 60 \
            'https://optionpilot-pro-v2-production.up.railway.app/api/research/h1-three-policy-descriptive-summary?limit=500' \
            -o /tmp/h1-three-policy-summary.json
          curl --fail --show-error --silent --location \
            --retry 3 --retry-delay 2 --max-time 60 \
            'https://optionpilot-pro-v2-production.up.railway.app/api/research/h1-live-gate-evidence-history?limit=500' \
            -o /tmp/h1-live-gate-history.json

      - name: Verify safety and print exact evidence summary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from collections import Counter
          from datetime import datetime

          d=json.load(open('/tmp/h1-three-policy-summary.json'))
          assert d.get('ok') is True, d
          assert d.get('mode') == 'READ_ONLY_H1_THREE_POLICY_DESCRIPTIVE_SUMMARY_V1', d.get('mode')
          s=d.get('safety') or {}
          assert s.get('readOnly') is True
          assert s.get('rawRecordsReturned') is False
          assert s.get('thresholdsInvented') is False
          assert s.get('acceptanceCriteriaApplied') is False
          assert s.get('validationDecisionMade') is False
          assert s.get('affectsSelector') is False
          assert s.get('affectsBusinessCard') is False
          assert s.get('affectsTelegram') is False
          assert s.get('affectsExecution') is False
          assert s.get('createsOrders') is False
          out={
            'rowCount': d.get('rowCount'),
            'premiumDeltaGamma': d.get('premiumDeltaGamma'),
            'thetaIvMultiExpiry': d.get('thetaIvMultiExpiry'),
            'capitalLiquidityDte': d.get('capitalLiquidityDte'),
            'validationDecision': d.get('validationDecision'),
            'acceptanceCriteriaApplied': d.get('acceptanceCriteriaApplied'),
            'productionPromotionEligible': d.get('productionPromotionEligible'),
          }
          print('H1_THREE_POLICY_PRODUCTION_SUMMARY', json.dumps(out, separators=(',',':'), sort_keys=True))

          h=json.load(open('/tmp/h1-live-gate-history.json'))
          assert h.get('ok') is True, h
          assert h.get('mode') == 'READ_ONLY_H1_LIVE_GATE_EVIDENCE_HISTORY_V1', h.get('mode')
          rows=h.get('records') or []
          gate_names=[
            'premiumResponseConfirmed','deltaGammaResponseConfirmed',
            'thetaIvBurdenAcceptable','multiExpiryConflictAbsent',
            'capitalFit','liquidityOk','spreadOk',
            'currentOrNearExpiryUsable','higherDteUsable','fallbackDteApproved'
          ]
          gate_counts={g:Counter() for g in gate_names}
          symbols=Counter()
          sides=Counter()
          dtes=Counter()
          premium_reasons=Counter()
          theta_reasons=Counter()
          premium_thresholds=Counter()
          theta_thresholds=Counter()
          metric_missing=Counter()
          premium_combo=Counter()
          ppd=Counter()
          raw_all_gates_pass=0
          effective_all_gates_pass_ignoring_runtime_freshness=0

          def gv(gates,name):
            ev=gates.get(name)
            return ev.get('value') if isinstance(ev,dict) and isinstance(ev.get('value'),bool) else None

          def parse_iso(v):
            if not isinstance(v,str):
              return None
            try:
              return datetime.fromisoformat(v.replace('Z','+00:00'))
            except Exception:
              return None

          for r in rows:
            ident=r.get('identity') or {}
            symbols[str(ident.get('symbol'))]+=1
            sides[str(ident.get('side'))]+=1
            dtes[str(ident.get('dte'))]+=1
            gates=r.get('gates') or {}
            for g in gate_names:
              value=gv(gates,g)
              gate_counts[g]['true' if value is True else 'false' if value is False else 'missing']+=1

            premium=gv(gates,'premiumResponseConfirmed')
            dg=gv(gates,'deltaGammaResponseConfirmed')
            premium_combo[
              'both_true' if premium is True and dg is True else
              'premium_only' if premium is True and dg is False else
              'delta_gamma_only' if premium is False and dg is True else
              'both_false' if premium is False and dg is False else
              'missing'
            ]+=1

            pd=(r.get('policyDiagnostics') or {}).get('premiumDeltaGamma') or {}
            for code in pd.get('reasonCodes') or []:
              premium_reasons[str(code)]+=1
            if pd:
              premium_thresholds[json.dumps({
                'minPremiumMovePct':pd.get('minPremiumMovePct'),
                'minAbsoluteDeltaChange':pd.get('minAbsoluteDeltaChange'),
                'minCurrentGamma':pd.get('minCurrentGamma')
              },sort_keys=True,separators=(',',':'))]+=1

            td=(r.get('policyDiagnostics') or {}).get('thetaIv') or {}
            for code in td.get('reasonCodes') or []:
              theta_reasons[str(code)]+=1
            if td:
              theta_thresholds[json.dumps({
                'maxAbsThetaPctOfPremium':td.get('maxAbsThetaPctOfPremium'),
                'minIv':td.get('minIv'),
                'maxIv':td.get('maxIv')
              },sort_keys=True,separators=(',',':'))]+=1

            metrics=r.get('responseMetrics') or {}
            for k in ('premiumMovePct','absoluteDeltaChange','currentGamma'):
              if metrics.get(k) is None:
                metric_missing[k]+=1

            p=r.get('ppdSupport')
            ppd_present=isinstance(p,dict)
            ppd['present' if ppd_present else 'missing']+=1
            ppd_confirmed=bool(ppd_present and p.get('candidateConfirmed') is True and p.get('allRequiredWindowsReady') is True and p.get('supportingOnly') is True and p.get('standaloneTrigger') is False)
            if ppd_present:
              ppd['candidate_confirmed' if ppd_confirmed else 'not_candidate_confirmed']+=1

            identity_match=bool(ppd_present and
              p.get('symbol')==ident.get('symbol') and
              p.get('expiryDate')==ident.get('expiryDate') and
              p.get('strike')==ident.get('strike') and
              p.get('candidateSide')==ident.get('side'))
            if ppd_present:
              ppd['identity_match' if identity_match else 'identity_mismatch']+=1

            ident_ts=parse_iso(ident.get('observedAt'))
            ppd_ts=parse_iso(p.get('observedAt')) if ppd_present else None
            near_packet_time=bool(ident_ts and ppd_ts and abs((ident_ts-ppd_ts).total_seconds()) <= 90)
            if ppd_present:
              ppd['within_90s_of_packet' if near_packet_time else 'outside_90s_or_invalid']+=1

            companion=(gv(gates,'liquidityOk') is True and
                       gv(gates,'spreadOk') is True and
                       dg is True and
                       gv(gates,'thetaIvBurdenAcceptable') is True and
                       gv(gates,'multiExpiryConflictAbsent') is True)
            structural_rescue=(premium is False and ppd_confirmed and identity_match and near_packet_time and companion)
            if structural_rescue:
              ppd['structural_rescue_possible']+=1

            symbol=ident.get('symbol')
            dte=ident.get('dte')
            dte_ok=(gv(gates,'higherDteUsable') is True) if symbol=='BANKNIFTY' else (gv(gates,'currentOrNearExpiryUsable') is True or (isinstance(dte,int) and 5 <= dte <= 7 and gv(gates,'fallbackDteApproved') is True))
            common=(gv(gates,'capitalFit') is True and gv(gates,'liquidityOk') is True and gv(gates,'spreadOk') is True and dg is True and gv(gates,'thetaIvBurdenAcceptable') is True and gv(gates,'multiExpiryConflictAbsent') is True and dte_ok)
            if common and premium is True:
              raw_all_gates_pass+=1
            if common and (premium is True or structural_rescue):
              effective_all_gates_pass_ignoring_runtime_freshness+=1

          audit={
            'recordCount':len(rows),
            'symbols':dict(symbols),
            'sides':dict(sides),
            'dtes':dict(dtes),
            'gateCounts':{g:dict(c) for g,c in gate_counts.items()},
            'premiumCooccurrence':dict(premium_combo),
            'premiumReasonCodes':dict(premium_reasons),
            'thetaReasonCodes':dict(theta_reasons),
            'premiumThresholdSnapshots':dict(premium_thresholds),
            'thetaThresholdSnapshots':dict(theta_thresholds),
            'responseMetricMissingCounts':dict(metric_missing),
            'ppdSupportAudit':dict(ppd),
            'rawAllRequiredGateBundlePassCount':raw_all_gates_pass,
            'effectiveAllRequiredGateBundlePassIgnoringRuntimeFreshnessCount':effective_all_gates_pass_ignoring_runtime_freshness,
          }
          print('H1_THREE_POLICY_REASON_AUDIT', json.dumps(audit, separators=(',',':'), sort_keys=True))
          PY


      - name: Print descriptive metric distributions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, math
          from collections import defaultdict
          h=json.load(open('/tmp/h1-live-gate-history.json'))
          rows=h.get('records') or []

          def q(values, p):
            vals=sorted(float(x) for x in values if isinstance(x,(int,float)) and math.isfinite(float(x)))
            if not vals:
              return None
            if len(vals)==1:
              return vals[0]
            pos=(len(vals)-1)*p
            lo=int(math.floor(pos)); hi=int(math.ceil(pos))
            if lo==hi: return vals[lo]
            return vals[lo] + (vals[hi]-vals[lo])*(pos-lo)

          metrics=defaultdict(list)
          by_symbol=defaultdict(lambda: defaultdict(list))
          for r in rows:
            ident=r.get('identity') or {}
            symbol=str(ident.get('symbol'))
            rm=r.get('responseMetrics') or {}
            pd=(r.get('policyDiagnostics') or {}).get('premiumDeltaGamma') or {}
            td=(r.get('policyDiagnostics') or {}).get('thetaIv') or {}
            cap=r.get('capitalLiquidityEvidence') or {}
            source={
              'premiumMovePct':rm.get('premiumMovePct'),
              'absoluteDeltaChange':rm.get('absoluteDeltaChange'),
              'currentGamma':rm.get('currentGamma'),
              'thetaPctOfPremium':td.get('thetaPctOfPremium'),
              'iv':td.get('iv'),
              'relativeSpreadPct':cap.get('relativeSpreadPct'),
              'bidDepthCoverageMultiple':cap.get('bidDepthCoverageMultiple'),
              'askDepthCoverageMultiple':cap.get('askDepthCoverageMultiple'),
              'capitalRequired':cap.get('capitalRequired'),
            }
            for k,v in source.items():
              if isinstance(v,(int,float)) and math.isfinite(float(v)):
                metrics[k].append(float(v))
                by_symbol[symbol][k].append(float(v))

          def summarize(d):
            out={}
            for k,vals in d.items():
              out[k]={
                'n':len(vals),
                'min':min(vals) if vals else None,
                'p10':q(vals,.10),
                'p25':q(vals,.25),
                'p50':q(vals,.50),
                'p75':q(vals,.75),
                'p90':q(vals,.90),
                'p95':q(vals,.95),
                'max':max(vals) if vals else None,
              }
            return out

          out={
            'all':summarize(metrics),
            'bySymbol':{s:summarize(m) for s,m in by_symbol.items()},
            'note':'DESCRIPTIVE_ONLY_NO_THRESHOLD_SELECTION_NO_PROMOTION'
          }
          print('H1_THREE_POLICY_METRIC_DISTRIBUTIONS', json.dumps(out, separators=(',',':'), sort_keys=True))
          PY
