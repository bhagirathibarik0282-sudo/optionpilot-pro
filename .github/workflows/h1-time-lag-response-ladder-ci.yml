name: H1 Time-Lag Response Ladder CI

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  time-lag-response-ladder:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx tsx test/h1-time-lag-response-ladder.test.ts
