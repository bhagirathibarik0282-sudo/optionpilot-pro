name: H1 Volatility Context Evidence CI

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  volatility-context-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx tsx test/h1-volatility-context-evidence.test.ts
