name: Heavyweight Sector Response Shadow CI

on:
  pull_request:
    paths:
      - "heavyweight-sector-response-shadow.ts"
      - "test/heavyweight-sector-response-shadow.test.ts"
      - ".github/workflows/heavyweight-sector-response-shadow-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  heavyweight-sector-response-shadow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run heavyweight sector response tests
        run: NODE_ENV=test node --import tsx --test test/heavyweight-sector-response-shadow.test.ts
