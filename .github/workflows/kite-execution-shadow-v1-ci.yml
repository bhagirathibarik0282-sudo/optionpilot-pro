name: Kite Execution Shadow V1 CI
on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:
jobs:
  kite-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node --import tsx --test test/kite-execution-shadow-v1.test.ts test/trade-lifecycle-engine.test.ts
