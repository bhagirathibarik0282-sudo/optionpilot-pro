name: Kite Full Depth Decoder CI

on:
  pull_request:
    paths:
      - 'kite-websocket-binary-decoder.ts'
      - 'test/kite-websocket-binary-decoder.test.ts'
      - '.github/workflows/kite-full-depth-decoder-ci.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx tsx --test test/kite-websocket-binary-decoder.test.ts
