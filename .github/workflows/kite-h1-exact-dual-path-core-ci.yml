name: Kite H1 Exact Dual Path Core CI

on:
  pull_request:
    paths:
      - 'kite-h1-exact-dual-path-core.ts'
      - 'test/kite-h1-exact-dual-path-core.test.ts'
      - '.github/workflows/kite-h1-exact-dual-path-core-ci.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx tsx --test test/kite-h1-exact-dual-path-core.test.ts
