name: Kite Runtime Shadow Supervisor CI

on:
  pull_request:
    paths:
      - 'kite-runtime-shadow-supervisor.ts'
      - 'kite-websocket-transport.ts'
      - 'kite-immediate-runtime-core.ts'
      - 'test/kite-runtime-shadow-supervisor.test.ts'
      - '.github/workflows/kite-runtime-shadow-supervisor-ci.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: NODE_ENV=test node --import tsx --test test/kite-websocket-transport.test.ts test/kite-immediate-runtime-core.test.ts test/kite-runtime-shadow-supervisor.test.ts
