name: Kite Server Shadow Wiring Audit CI

on:
  pull_request:
    paths:
      - 'server.ts'
      - 'kite-runtime-shadow-supervisor.ts'
      - 'scripts/kite-server-shadow-wiring-audit.mjs'
      - '.github/workflows/kite-server-shadow-wiring-audit-ci.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/kite-server-shadow-wiring-audit.mjs
