name: Kite Shadow Final Shortcut CI

on:
  pull_request:
    paths:
      - 'kite-shadow-runtime-service.ts'
      - 'test/kite-shadow-runtime-service.test.ts'
      - 'package.json'
      - '.github/workflows/kite-shadow-final-shortcut-ci.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: NODE_ENV=test node --import tsx --test test/kite-shadow-runtime-service.test.ts test/kite-runtime-shadow-authority-binding.test.ts test/kite-runtime-shadow-supervisor.test.ts test/kite-websocket-transport.test.ts
      - run: KITE_RUNTIME_SHADOW_ENABLED=false node --import tsx kite-shadow-runtime-service.ts
