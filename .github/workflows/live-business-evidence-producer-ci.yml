name: Live Business Evidence Producer CI

on:
  pull_request:
    paths:
      - "live-business-evidence-producer.ts"
      - "test/live-business-evidence-producer.test.ts"
      - ".github/workflows/live-business-evidence-producer-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: NODE_ENV=test node --import tsx --test test/live-business-evidence-producer.test.ts
