name: Live Shadow Market Binding CI

on:
  pull_request:
    branches:
      - main
    paths:
      - live-shadow-market-binding.ts
      - test/live-shadow-market-binding.test.ts
      - .github/workflows/live-shadow-market-binding-ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: node --import tsx --test test/live-shadow-market-binding.test.ts
