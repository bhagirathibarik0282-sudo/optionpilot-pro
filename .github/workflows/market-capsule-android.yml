name: Market Capsule Android

on:
  push:
    branches: ['feature/market-capsule-android']
    paths:
      - 'market-capsule-android/**'
      - '.github/workflows/market-capsule-android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: market-capsule-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-build:
    name: Compile, test, lint and package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: market-capsule-android
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Verify Gradle wrapper integrity
        run: echo '81a82aaea5abcc8ff68b3dfcb58b3c3c429378efd98e7433460610fecd7ae45f  gradle/wrapper/gradle-wrapper.jar' | sha256sum --check --strict
      - name: Install Android platform
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"'
      - name: Run unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest --stacktrace
      - name: Run Android lint
        run: ./gradlew --no-daemon :app:lintDebug --stacktrace
      - name: Build test APK
        run: ./gradlew --no-daemon :app:assembleDebug --stacktrace
      - name: Android 15 offline emulator acceptance
        timeout-minutes: 15
        run: ./scripts/emulator-acceptance.sh
      - name: Save test APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: market-capsule-test-apk-${{ github.sha }}
          path: market-capsule-android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
          if-no-files-found: error
      - name: Save validation reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: market-capsule-validation-${{ github.sha }}
          path: |
            market-capsule-android/app/build/reports/
            market-capsule-android/app/build/test-results/
            market-capsule-android/app/build/outputs/androidTest-results/
            market-capsule-android/app/build/emulator-evidence/
          retention-days: 7
          if-no-files-found: ignore
