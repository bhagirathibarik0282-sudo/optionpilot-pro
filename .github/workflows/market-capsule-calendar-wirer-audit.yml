name: Market Capsule runtime calendar guard
on:
  push:
    branches: ['feature/market-capsule-android', 'main', 'production']
    paths:
      - 'scripts/wire-market-session-calendar.mjs'
      - 'test/market-calendar-wirer-idempotence.test.mjs'
      - '.github/workflows/market-capsule-calendar-wirer-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  calendar-wirer:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Repeated prepare syntax and idempotence regression
        run: node --test test/market-calendar-wirer-idempotence.test.mjs
