name: Market Capsule Stable APK (owner-approved)

# A deliberate [capsule-release] commit on the Android branch starts release.
# Ordinary development pushes do not use signing secrets or publish an APK.
# Manual dispatch remains available.
on:
  push:
    branches: [feature/market-capsule-android]
    paths:
      - market-capsule-android/app/build.gradle.kts
      - .github/workflows/market-capsule-stable-release.yml
  workflow_dispatch:
    inputs:
      publish:
        description: 'Explicitly publish a PUBLIC GitHub release with this signed APK'
        type: boolean
        default: false
        required: true

permissions:
  contents: write

concurrency:
  group: market-capsule-stable-release
  cancel-in-progress: false

jobs:
  verified-release:
    # Do not run against default/main or arbitrary PR/branch source code.
    if: >-
      github.repository == 'bhagirathibarik0282-sudo/optionpilot-pro' &&
      github.ref == 'refs/heads/feature/market-capsule-android' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && contains(github.event.head_commit.message, '[capsule-release]')))
    runs-on: ubuntu-24.04
    environment: market-capsule-stable-release
    timeout-minutes: 40
    defaults:
      run:
        working-directory: market-capsule-android
        shell: bash
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate source version and unique release tag
        id: release_intent
        run: |
          set -euo pipefail
          TAG="$(python3 ../scripts/market-capsule-release/derive_tag.py app/build.gradle.kts)"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo 'RELEASE_TAG_ALREADY_EXISTS'; exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Test stable APK verification policy without owner secrets
        run: python3 -m unittest discover -s ../scripts/market-capsule-release -v
      - name: Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Verify Gradle wrapper integrity
        run: echo '81a82aaea5abcc8ff68b3dfcb58b3c3c429378efd98e7433460610fecd7ae45f  gradle/wrapper/gradle-wrapper.jar' | sha256sum --check --strict
      - name: Install Android platform
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"'
      - name: Decode the owner-held keystore into the temporary runner only
        env:
          PRIVATE_KEY_B64: ${{ secrets.MC_RELEASE_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          [[ -n "$PRIVATE_KEY_B64" ]] || { echo 'MISSING_OWNER_KEY'; exit 1; }
          umask 077
          printf '%s' "$PRIVATE_KEY_B64" | base64 --decode > "$RUNNER_TEMP/capsule-stable.jks"
          test -s "$RUNNER_TEMP/capsule-stable.jks"
          echo "MC_RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/capsule-stable.jks" >> "$GITHUB_ENV"
      - name: Build and unit-check owner-signed stable APK
        env:
          MC_RELEASE_STORE_PASSWORD: ${{ secrets.MC_RELEASE_STORE_PASSWORD }}
          MC_RELEASE_KEY_ALIAS: ${{ secrets.MC_RELEASE_KEY_ALIAS }}
          MC_RELEASE_KEY_PASSWORD: ${{ secrets.MC_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          [[ -n "$MC_RELEASE_STORE_PASSWORD" && -n "$MC_RELEASE_KEY_ALIAS" && -n "$MC_RELEASE_KEY_PASSWORD" ]] || { echo 'MISSING_SIGNING_SECRETS'; exit 1; }
          ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleRelease :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Android 15 emulator acceptance
        timeout-minutes: 15
        run: ./scripts/emulator-acceptance.sh
      - name: Verify exact release identity, version and signing certificate
        env:
          TAG: ${{ steps.release_intent.outputs.tag }}
          EXPECTED_CERT_SHA256: ${{ vars.MC_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          sdk="$ANDROID_HOME/build-tools/35.0.0"
          "$sdk/aapt" dump badging "$apk" > "$RUNNER_TEMP/stable-badging.txt"
          "$sdk/apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/stable-signature.txt"
          python3 ../scripts/market-capsule-release/verify_apk.py \
            --badging "$RUNNER_TEMP/stable-badging.txt" \
            --signature "$RUNNER_TEMP/stable-signature.txt" \
            --tag "$TAG" --expected-cert "$EXPECTED_CERT_SHA256"
          mkdir -p release-out
          cp "$apk" release-out/Market-Capsule-Stable.apk
          (cd release-out && sha256sum Market-Capsule-Stable.apk > Market-Capsule-Stable.apk.sha256)
          echo 'Stable package and signer verified; private signing material never published.'
      - name: Publish verified PUBLIC release for deliberate release request
        if: (github.event_name == 'workflow_dispatch' && inputs.publish == true) || github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release_intent.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            "release-out/Market-Capsule-Stable.apk#Market-Capsule-Stable.apk" \
            "release-out/Market-Capsule-Stable.apk.sha256#Market-Capsule-Stable.apk.sha256" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
            --title "Market Capsule Stable $TAG" \
            --notes "Owner-approved, read-only Android stable APK. Android package: com.marketcapsule.app.stable. Built from $GITHUB_SHA. Verify signing fingerprint and SHA-256. The first installation can run beside the earlier debug APK."
      - name: Cleanup temporary key file
        if: always()
        run: rm -f "$RUNNER_TEMP/capsule-stable.jks"
