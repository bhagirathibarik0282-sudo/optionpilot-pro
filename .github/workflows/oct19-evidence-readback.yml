name: Oct19 NIFTY Evidence Readback - one time
on:
  push:
    branches:
      - research/oct19-evidence-readback-20261020
    paths:
      - .github/workflows/oct19-evidence-readback.yml
  pull_request:
    paths:
      - .github/workflows/oct19-evidence-readback.yml
permissions:
  contents: read
jobs:
  read-verified-recorded-data:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: One bounded read-only call to existing production evidence endpoint
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request
          url='https://optionpilot-pro-v2-production.up.railway.app/api/research/premium-spread/oct19-nifty-chain-evidence'
          req=urllib.request.Request(url,headers={'Accept':'application/json','User-Agent':'OptionPilot-PostFix-ReadOnly/1'})
          with urllib.request.urlopen(req,timeout=105) as response:
              d=json.load(response)
              print("HTTP",response.status)
          print("MODE",d.get("mode"),"OK",d.get("ok"),"TIMES",d.get("observationTimesIst"))
          for x in d.get("observations",[]):
              fields=['timeIst','status','spot','future','indiaVix','reportedFullChainPcr','atmStrike','ceWallStrike','peWallStrike','atmMovedOneMinute','ceWallMovedOneMinute','peWallMovedOneMinute']
              print('MARKET_AND_CHAIN',json.dumps({k:x.get(k) for k in fields},separators=(',',':')))
              print('QUALITY',json.dumps({k:x.get('quality',{}).get(k) for k in ['selectedExpiryChainRowPresent','validOptionRows','allRecordedOptionsAtMinute','previousMarketPresent']},separators=(',',':')))
              print('DELTA_OI',json.dumps(x.get('deltaWeightedOiObservedOnly'),separators=(',',':')))
              for p in x.get('sameDeltaPairs',[]):
                  keys=['target','status','ceStrike','peStrike','ceDelta','peDelta','ceLtp','peLtp','ceMinusPe','oneMinuteSpotChange','oneMinuteSpreadChange','oneMinuteDeltaAdjustedResidual','ceOneMinuteOiChange','peOneMinuteOiChange']
                  print('PAIR',json.dumps({k:p.get(k) for k in keys},separators=(',',':')))
          assert d.get("ok") is True and len(d.get("observations",[]))==5
          PY
