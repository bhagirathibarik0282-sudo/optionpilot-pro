name: Option Buyer Fixed30m Regime DTE Lift CI
on:
  pull_request:
    paths:
      - 'option-buyer-fixed30m-regime-dte-lift.ts'
      - 'test/option-buyer-fixed30m-regime-dte-lift.test.ts'
      - '.github/workflows/option-buyer-fixed30m-regime-dte-lift-ci.yml'
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx tsx --test test/option-buyer-fixed30m-regime-dte-lift.test.ts
