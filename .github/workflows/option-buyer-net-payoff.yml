name: Option Buyer Net Payoff CI

on:
  pull_request:
    paths:
      - 'option-buyer-net-payoff-research.ts'
      - 'test/option-buyer-net-payoff-research.test.ts'
      - '.github/workflows/option-buyer-net-payoff.yml'
  workflow_dispatch:

jobs:
  option-buyer-net-payoff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run option buyer net payoff research tests
        run: NODE_ENV=test node --import tsx --test test/option-buyer-net-payoff-research.test.ts
