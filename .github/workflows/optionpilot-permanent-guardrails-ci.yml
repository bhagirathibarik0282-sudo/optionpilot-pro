name: OptionPilot Permanent Guardrails CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  permanent-guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/optionpilot-guardrail-check.mjs
