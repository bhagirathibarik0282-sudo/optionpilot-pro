name: Phase53 Apply Shadow Wiring

on:
  push:
    branches:
      - phase53-shadow-wiring-fix

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: phase53-shadow-wiring-fix

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Apply existing Phase50 shadow wiring patch
        run: node scripts/phase50-score-observation-patch.mjs

      - name: Verify server wiring markers
        run: |
          grep -q 'PHASE50_KNOWN_THEN_SCORE_WIRING_V1' server.ts
          grep -q 'persistKnownThenScoreObservation' server.ts
          grep -q 'sourcePath: "/api/premium-diagnostic/snapshot"' server.ts

      - name: Run package tests
        run: npm test

      - name: Commit verified wiring and remove temporary workflow
        run: |
          rm .github/workflows/phase53-apply-shadow-wiring.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts test/phase50-score-observation-patch.test.ts .github/workflows/phase53-apply-shadow-wiring.yml
          git diff --cached --quiet && exit 0
          git commit -m "Phase 53: wire known-then shadow score persistence"
          git push origin HEAD:phase53-shadow-wiring-fix
