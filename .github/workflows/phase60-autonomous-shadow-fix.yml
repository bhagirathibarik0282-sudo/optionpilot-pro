name: Phase60 Autonomous Shadow Fix

on:
  push:
    branches:
      - phase59-autonomous-shadow-fix
    paths:
      - scripts/phase60-autonomous-shadow-observer-patch.mjs
      - .github/workflows/phase60-autonomous-shadow-fix.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated fix branch
        uses: actions/checkout@v4
        with:
          ref: phase59-autonomous-shadow-fix
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Apply fail-closed Phase60 patch
        run: node scripts/phase60-autonomous-shadow-observer-patch.mjs

      - name: Verify patch safety invariants
        run: |
          grep -q 'PHASE60_AUTONOMOUS_SHADOW_OBSERVER_V1' server.ts
          grep -q 'validateDataServer(symbol, m, session, null)' server.ts
          grep -q 'runRuleEngineServer(symbol, m, validation, null)' server.ts
          git diff --check

      - name: Run full existing test suite
        run: npm test

      - name: Commit verified server wiring
        run: |
          if git diff --quiet -- server.ts; then
            echo 'No server.ts changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.ts
          git commit -m 'Phase 60: wire autonomous shadow observer'
          git push origin HEAD:phase59-autonomous-shadow-fix
