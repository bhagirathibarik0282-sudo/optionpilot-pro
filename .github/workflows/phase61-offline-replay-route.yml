name: Phase61 Offline Replay Coverage Route

on:
  push:
    branches:
      - phase59-autonomous-shadow-fix
    paths:
      - scripts/phase61-offline-replay-route-patch.mjs
      - .github/workflows/phase61-offline-replay-route.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated shadow branch
        uses: actions/checkout@v4
        with:
          ref: phase59-autonomous-shadow-fix
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Apply fail-closed Phase61 patch
        run: node scripts/phase61-offline-replay-route-patch.mjs

      - name: Verify read-only safety invariants
        run: |
          grep -q 'PHASE61_OFFLINE_REPLAY_COVERAGE_ROUTE_V1' server.ts
          grep -q '/api/offline-research/replay-input-coverage' server.ts
          grep -q 'REPLAY_INPUT_AVAILABLE' server.ts
          git diff --check
          node -e "const fs=require('fs');const s=fs.readFileSync('scripts/phase61-offline-replay-route-patch.mjs','utf8');if(/INSERT\\s+INTO|DELETE\\s+FROM|CREATE\\s+TABLE/i.test(s))process.exit(1)"

      - name: Run full existing test suite
        run: npm test

      - name: Commit verified server wiring
        run: |
          if git diff --quiet -- server.ts; then
            echo 'No server.ts changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.ts
          git commit -m 'Phase 61: add read-only replay coverage route'
          git push origin HEAD:phase59-autonomous-shadow-fix
