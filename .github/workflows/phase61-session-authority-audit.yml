name: Phase61 Session Authority Audit

on:
  push:
    branches:
      - phase61-session-authority-audit
    paths:
      - 'server.ts'
      - 'scripts/phase61-session-authority-audit.mjs'
      - '.github/workflows/phase61-session-authority-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run source-only session authority audit
        run: node scripts/phase61-session-authority-audit.mjs

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: phase61-session-authority-audit
          path: phase61-session-authority-audit.json
          if-no-files-found: error
