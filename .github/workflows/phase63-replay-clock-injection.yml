name: Phase63 Replay Clock Injection

on:
  push:
    branches:
      - phase59-autonomous-shadow-fix
    paths:
      - scripts/phase63-replay-clock-injection-patch.mjs
      - .github/workflows/phase63-replay-clock-injection.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated shadow branch
        uses: actions/checkout@v4
        with:
          ref: phase59-autonomous-shadow-fix
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Apply replay-safe clock patch
        run: node scripts/phase63-replay-clock-injection-patch.mjs

      - name: Verify safety invariants
        run: |
          grep -q 'PHASE63_REPLAY_CLOCK_INJECTION_V1' server.ts
          grep -q 'nowMs: number = Date.now()' server.ts
          grep -q 'const timestamp = new Date(nowMs).toISOString();' server.ts
          grep -q 'const ageMs = effTs ? nowMs - new Date(effTs).getTime() : null;' server.ts
          git diff --check

      - name: Run full existing test suite
        run: npm test

      - name: Commit verified clock injection
        run: |
          if git diff --quiet -- server.ts; then
            echo 'No server.ts changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.ts
          git commit -m 'Phase 63: inject replay-safe validator clock'
          git push origin HEAD:phase59-autonomous-shadow-fix
