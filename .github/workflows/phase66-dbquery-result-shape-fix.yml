name: Phase66 DBQuery Result Shape Fix

on:
  push:
    branches: [phase59-autonomous-shadow-fix]
    paths:
      - 'scripts/phase66-dbquery-result-shape-fix.mjs'
      - '.github/workflows/phase66-dbquery-result-shape-fix.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated shadow branch
        uses: actions/checkout@v4
        with:
          ref: phase59-autonomous-shadow-fix
          fetch-depth: 0
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Apply exact dbQuerySafe result-shape repair
        run: node scripts/phase66-dbquery-result-shape-fix.mjs
      - name: Syntax compile server.ts
        run: ./node_modules/.bin/esbuild server.ts --platform=node --format=esm --outfile=/tmp/server-check.mjs --log-level=error
      - name: Verify replay safety invariants
        run: |
          grep -q 'PHASE66_DBQUERY_RESULT_SHAPE_FIX_V1' server.ts
          grep -q 'const marketRows = marketQuery.rows;' server.ts
          grep -q 'const chainRows = chainQuery.rows;' server.ts
          ! grep -q 'for (const row of chainQuery)' server.ts
          ! grep -q 'for (const row of marketQuery)' server.ts
          git diff --check
      - name: Run full existing test suite
        run: npm test
      - name: Commit verified dbQuerySafe shape fix
        run: |
          if git diff --quiet -- server.ts; then
            echo 'No server.ts change required'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.ts
          git commit -m 'Phase 66: unwrap dbQuerySafe rows in replay'
          git push origin HEAD:phase59-autonomous-shadow-fix
