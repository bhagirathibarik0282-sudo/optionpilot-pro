name: Phase66 Replay Query Diagnostic

on:
  push:
    branches: [phase59-autonomous-shadow-fix]
    paths:
      - 'scripts/phase66-query-diagnostic-patch.mjs'
      - '.github/workflows/phase66-query-diagnostic.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout isolated shadow branch
        uses: actions/checkout@v4
        with:
          ref: phase59-autonomous-shadow-fix
          fetch-depth: 0
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Apply safe query diagnostic
        run: node scripts/phase66-query-diagnostic-patch.mjs
      - name: Syntax compile server.ts
        run: npx esbuild server.ts --platform=node --format=esm --outfile=/tmp/phase66diag.js
      - name: Verify diagnostics and safety
        run: |
          grep -q 'PHASE66_QUERY_DIAGNOSTIC_V1' server.ts
          grep -q 'MARKET_QUERY_FAILED' server.ts
          grep -q 'CHAIN_QUERY_FAILED' server.ts
          git diff --check
      - name: Run full existing test suite
        run: npm test
      - name: Commit verified query diagnostic
        run: |
          if git diff --quiet -- server.ts; then
            echo 'No server.ts change to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.ts
          git commit -m 'Phase 66: distinguish replay query failures'
          git push origin HEAD:phase59-autonomous-shadow-fix
