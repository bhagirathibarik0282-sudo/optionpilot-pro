name: Phase66 Replay Reconstruction Guard

on:
  push:
    branches: [phase59-autonomous-shadow-fix]
    paths:
      - 'scripts/phase66-reconstruction-guard-patch.mjs'
      - '.github/workflows/phase66-reconstruction-guard.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated shadow branch
        uses: actions/checkout@v4
        with:
          ref: phase59-autonomous-shadow-fix
          fetch-depth: 0
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Apply exact reconstruction guard
        run: node scripts/phase66-reconstruction-guard-patch.mjs
      - name: Syntax compile server.ts
        run: npx esbuild server.ts --platform=node --format=esm --outfile=/tmp/phase66-server.mjs
      - name: Verify replay safety invariants
        run: |
          grep -q 'PHASE66_REPLAY_RECONSTRUCTION_GUARD_V1' server.ts
          grep -q 'RECONSTRUCTION_RUNTIME_FAILED' server.ts
          grep -q 'VALIDATION_RUNTIME_FAILED' server.ts
          grep -q 'RULE_ENGINE_RUNTIME_FAILED' server.ts
          ! grep -q 'persistKnownThenScoreObservation(symbol, m' server.ts
          git diff --check
      - name: Run full existing test suite
        run: npm test
      - name: Commit verified reconstruction guard
        run: |
          if git diff --quiet -- server.ts; then
            echo 'No server.ts changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.ts
          git commit -m 'Phase 66: guard replay reconstruction timestamps'
          git push origin HEAD:phase59-autonomous-shadow-fix
