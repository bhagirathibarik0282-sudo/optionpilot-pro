name: Phase66 Replay Schema Column Fix

on:
  push:
    branches: [phase59-autonomous-shadow-fix]
    paths:
      - scripts/phase66-schema-column-fix.mjs
      - .github/workflows/phase66-schema-column-fix.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated shadow branch
        uses: actions/checkout@v4
        with:
          ref: phase59-autonomous-shadow-fix
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Apply canonical DB column repair
        run: node scripts/phase66-schema-column-fix.mjs

      - name: Syntax compile server.ts
        run: npx esbuild server.ts --platform=node --format=esm --outfile=/tmp/phase66-server.js

      - name: Verify replay safety invariants
        run: |
          grep -q 'PHASE66_NIFTY_DETERMINISTIC_REPLAY_V1' server.ts
          grep -q 'backend_timestamp' server.ts
          grep -q 'full_chain_oi_pcr' server.ts
          grep -q 'india_vix' server.ts
          ! grep -A170 'PHASE66_NIFTY_DETERMINISTIC_REPLAY_V1' server.ts | grep -q 'persistKnownThenScoreObservation('
          ! grep -A170 'PHASE66_NIFTY_DETERMINISTIC_REPLAY_V1' server.ts | grep -q 'placeOrder('
          git diff --check

      - name: Run full existing test suite
        run: npm test

      - name: Commit verified schema fix
        run: |
          if git diff --quiet -- server.ts; then
            echo 'No server.ts change to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.ts
          git commit -m 'Phase 66: fix replay DB schema columns'
          git push origin HEAD:phase59-autonomous-shadow-fix
