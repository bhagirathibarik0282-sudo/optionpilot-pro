name: Phase66 Transform Crash Fix

on:
  push:
    branches:
      - phase59-autonomous-shadow-fix
    paths:
      - scripts/phase66-transform-crash-fix.mjs
      - .github/workflows/phase66-transform-crash-fix.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout isolated shadow branch
        uses: actions/checkout@v4
        with:
          ref: phase59-autonomous-shadow-fix
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Apply exact TransformError repair
        run: node scripts/phase66-transform-crash-fix.mjs

      - name: Syntax compile server.ts
        run: ./node_modules/.bin/esbuild server.ts --platform=node --format=esm --outfile=/tmp/server-check.mjs --log-level=error

      - name: Verify Phase 66 safety invariants
        run: |
          grep -q 'PHASE66_NIFTY_DETERMINISTIC_REPLAY_V1' server.ts
          grep -q 'validateDataServer(symbol, m, replaySession, null, nowMs)' server.ts
          grep -q 'runRuleEngineServerCore(symbol, m, validation, null)' server.ts
          ! grep -A180 'PHASE66_NIFTY_DETERMINISTIC_REPLAY_V1' server.ts | grep -E 'placeOrder\(|sendTelegram|persistKnownThenScoreObservation\('
          git diff --check

      - name: Run full existing test suite
        run: npm test

      - name: Commit verified crash fix
        run: |
          if git diff --quiet -- server.ts; then
            echo 'No server.ts change to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.ts
          git commit -m 'Phase 66: repair replay SQL transform crash'
          git push origin HEAD:phase59-autonomous-shadow-fix
