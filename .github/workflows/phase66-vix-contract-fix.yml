name: Phase66 Replay VIX Contract Fix

on:
  push:
    branches: [phase59-autonomous-shadow-fix]
    paths:
      - 'scripts/phase66-vix-contract-fix.mjs'
      - '.github/workflows/phase66-vix-contract-fix.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated shadow branch
        uses: actions/checkout@v4
        with:
          ref: phase59-autonomous-shadow-fix
          fetch-depth: 0
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Apply exact VIX contract repair
        run: node scripts/phase66-vix-contract-fix.mjs
      - name: Syntax compile server.ts
        run: npx esbuild server.ts --platform=node --format=esm --outfile=/tmp/phase66-server-check.mjs --log-level=error
      - name: Verify replay safety invariants
        run: |
          grep -q 'PHASE66_NIFTY_DETERMINISTIC_REPLAY_V1' server.ts
          grep -q 'const vix = Number(row.india_vix);' server.ts
          grep -q 'const vixChange = Number(row.india_vix_change);' server.ts
          ! grep -q 'india_india_vix_change' server.ts
          grep -q 'validateDataServer(symbol, m, replaySession, null, nowMs)' server.ts
          grep -q 'runRuleEngineServerCore(symbol, m, validation, null)' server.ts
          git diff --check
      - name: Run full existing test suite
        run: npm test
      - name: Commit verified VIX contract fix
        run: |
          if git diff --quiet -- server.ts; then
            echo 'No server.ts change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.ts
          git commit -m 'Phase 66: fix replay VIX DB/runtime contract'
          git push origin HEAD:phase59-autonomous-shadow-fix
