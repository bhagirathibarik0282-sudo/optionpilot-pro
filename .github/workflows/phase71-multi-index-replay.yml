name: Phase71 Multi Index Replay

on:
  push:
    branches: [phase59-autonomous-shadow-fix]
    paths:
      - 'scripts/phase71-multi-index-replay-patch.mjs'
      - '.github/workflows/phase71-multi-index-replay.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout isolated shadow branch
        uses: actions/checkout@v4
        with:
          ref: phase59-autonomous-shadow-fix
          fetch-depth: 0
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Apply Phase71 multi-index replay patch
        run: node scripts/phase71-multi-index-replay-patch.mjs
      - name: Syntax compile server.ts
        run: npx esbuild server.ts --platform=node --format=esm --outfile=/tmp/phase71-server.mjs --log-level=error
      - name: Devil-check Phase71 parity invariants
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('server.ts','utf8');
          const a=s.indexOf('app.get("/api/offline-research/nifty-deterministic-replay"');
          const b=s.indexOf('app.get("/api/research/shadow-diagnostic-trace"',a);
          if(a<0||b<0) throw new Error('replay route missing');
          const x=s.slice(a,b);
          for(const q of ['PHASE71_MULTI_INDEX_REPLAY_V1','"BANKNIFTY"','"SENSEX"','[symbol]: { spot: current, pcr, vix }','validateDataServer(symbol, m, replaySession, null, marketBucketMs)','runRuleEngineServerCore(symbol, m, validation, null)']) if(!x.includes(q)) throw new Error('missing '+q);
          if(x.includes('NIFTY: { spot: current, pcr, vix }')) throw new Error('P0: hardcoded NIFTY history remains');
          for(const q of ['placeOrder(','sendTelegram','persistKnownThenScoreObservation(','dbInsert(']) if(x.includes(q)) throw new Error('forbidden side effect '+q);
          NODE
          git diff --check
      - name: Run full existing test suite
        run: npm test
      - name: Commit verified Phase71 multi-index replay
        run: |
          if git diff --quiet -- server.ts; then
            echo 'No server change needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.ts
          git commit -m 'Phase 71: enable multi-index deterministic replay'
          git push origin HEAD:phase59-autonomous-shadow-fix
