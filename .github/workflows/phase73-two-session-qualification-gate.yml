name: Phase73 Two Session Qualification Gate

on:
  push:
    branches: [phase59-autonomous-shadow-fix]
    paths:
      - 'scripts/phase73-two-session-qualification-gate-patch.mjs'
      - '.github/workflows/phase73-two-session-qualification-gate.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout isolated shadow branch
        uses: actions/checkout@v4
        with:
          ref: phase59-autonomous-shadow-fix
          fetch-depth: 0
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Apply Phase73 qualification gate patch
        run: node scripts/phase73-two-session-qualification-gate-patch.mjs
      - name: Syntax compile server.ts
        run: npx esbuild server.ts --platform=node --format=esm --outfile=/tmp/phase73-server.mjs --log-level=error
      - name: Devil-check Phase73 qualification safety
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('server.ts','utf8');
          const a=s.indexOf('PHASE73_TWO_SESSION_QUALIFICATION_GATE_V1');
          const b=s.indexOf('app.get("/api/research/shadow-diagnostic-trace"',a);
          if(a<0||b<0) throw new Error('Phase73 gate missing');
          const x=s.slice(a,b);
          for(const q of ['offlineReplayCountsAsLive: false','automaticPromotionAllowed: false',"source_path = 'server:runRuleEngineServer'",'requiredLiveSessions: 2','qualified: false']) if(!x.includes(q)) throw new Error('missing '+q);
          for(const q of ['placeOrder(','sendTelegram','persistKnownThenScoreObservation(','dbInsert(']) if(x.includes(q)) throw new Error('forbidden side effect '+q);
          NODE
          git diff --check
      - name: Full existing test suite
        run: npm test
      - name: Commit verified Phase73 gate
        run: |
          if git diff --quiet -- server.ts; then
            echo 'No server change needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.ts
          git commit -m 'Phase 73: add two-session qualification evidence gate'
          git push origin HEAD:phase59-autonomous-shadow-fix
