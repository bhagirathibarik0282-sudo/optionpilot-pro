name: Phase 76 Second Max Pain Path Audit

on:
  push:
    branches:
      - phase76-second-max-pain-path-audit
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit remaining Max Pain path
        run: node scripts/phase76-second-max-pain-path-audit.mjs
