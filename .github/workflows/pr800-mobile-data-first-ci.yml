name: PR800 Mobile Data First UI CI
on:
  pull_request:
    paths:
      - 'recorded-dashboard-view.ts'
      - 'oi-ranked-ladder.ts'
      - 'oi-wall-studio.ts'
      - 'oi-wall-replay.ts'
      - 'recorded-premium-session.ts'
      - 'recorded-replay-view.ts'
      - 'recorded-sixty-point-finder.ts'
      - 'scripts/recorded-sixty-point-mobile-smoke.ts'
      - 'rag-evidence-card.ts'
      - 'rag-event-evidence.ts'
      - 'premium-response-evidence.ts'
      - 'screen-overview.ts'
      - 'test/screen-overview-evidence.test.ts'
      - 'one-shot-live-card.ts'
      - 'dashboard-workspace-view.ts'
      - 'test/mobile-data-first.test.ts'
      - 'test/reference-research-terminal.test.ts'
      - 'scripts/pr800-mobile-data-first-smoke.ts'
      - 'scripts/rag-evidence-workflow-smoke.ts'
      - 'rag-same-dte-history.ts'
      - 'rag-same-dte-history-http.ts'
      - 'test/fixtures/rag-minute-access-production-20261104.json'
      - '.github/workflows/pr800-mobile-data-first-ci.yml'
permissions:
  contents: read
jobs:
  mobile-data-first:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NODE_ENV: test
      DATABASE_URL: ''
      KITE_API_KEY: ''
      KITE_API_SECRET: ''
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install existing dependencies and isolated Chromium
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Validate source-safe order and mobile styles
        run: NODE_ENV=test node --import tsx --test test/mobile-data-first.test.ts test/reference-research-terminal.test.ts test/one-stop-card.test.ts test/screen-overview-evidence.test.ts
      - name: Test 360px and 390px mobile and desktop browser layout
        run: node --import tsx scripts/pr800-mobile-data-first-smoke.ts
      - name: Verify recorded premium finder at 360px and 390px
        run: node --import tsx scripts/recorded-sixty-point-mobile-smoke.ts
      - name: Verify same-page evidence with frozen production endpoints
        run: node --import tsx scripts/rag-evidence-workflow-smoke.ts
      - name: Verify no whitespace mistakes
        run: git diff --check origin/main...HEAD
      - name: Keep offline no-data browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr800-mobile-data-first-no-data
          path: pr800-mobile-ui-artifacts/
          retention-days: 2
          if-no-files-found: ignore
