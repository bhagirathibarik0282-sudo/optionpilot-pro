name: RAG Multi-DTE Production Readback Proof CI
on:
  pull_request:
    paths:
      - 'test/rag-dte-production-readback-practical.test.ts'
      - '.github/workflows/rag-dte-production-readback-proof.yml'
  workflow_dispatch:
jobs:
  read-only-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: node --import tsx --test test/rag-dte-production-readback-practical.test.ts
