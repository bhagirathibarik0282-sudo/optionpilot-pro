name: RAG Event Context Ladder CI
on:
  pull_request:
    paths:
      - 'rag-event-context-ladder.ts'
      - 'test/rag-event-context-ladder.test.ts'
      - '.github/workflows/rag-event-context-ladder-ci.yml'
permissions:
  contents: read
jobs:
  event-context-gates:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install existing dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run event-wise context and publication-cutoff regressions
        run: NODE_ENV=test node --import tsx --test test/rag-event-context-ladder.test.ts
      - name: Verify patch whitespace
        run: git diff --check HEAD^ HEAD
