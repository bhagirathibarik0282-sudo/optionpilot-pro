name: RAG Event Context Ladder CI
on:
  pull_request:
    paths:
      - 'recorder-matched-history.ts'
      - 'test/recorder-matched-history.test.ts'
      - 'recorder-matched-outcome.ts'
      - 'test/recorder-matched-outcome.test.ts'
      - 'rag-event-context-ladder.ts'
      - 'test/rag-event-context-ladder.test.ts'
      - 'rag-event-context-ladder-view.ts'
      - 'test/rag-event-context-ladder-view.test.ts'
      - 'rag-recorder-event-ladder-bridge.ts'
      - 'test/rag-recorder-event-ladder-bridge.test.ts'
      - 'rag-recorded-spread-source-audit.ts'
      - 'test/rag-recorded-spread-source-audit.test.ts'
      - 'recorded-replay-view.ts'
      - 'pr799-recorder-preview.ts'
      - 'scripts/pr799-recorder-preview.ts'
      - 'test/pr799-recorder-preview.test.ts'
      - 'h1-theory-history.ts'
      - 'scripts/pr799-matched-history-acceptance.ts'
      - 'test/h1-recorded-date-reader.test.ts'
      - 'pr799-browser-capture.ts'
      - 'scripts/pr799-browser-capture.ts'
      - 'test/pr799-browser-capture.test.ts'
      - 'research-router.ts'
      - 'h1-replay-http.ts'
      - 'h1-replay-plan-audit.ts'
      - 'scripts/inspect-h1-replay-plan.ts'
      - 'test/h1-replay-plan-audit.test.ts'
      - '.github/workflows/rag-event-context-ladder-ci.yml'
permissions:
  contents: read
jobs:
  event-context-gates:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install existing dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run event-wise context and publication-cutoff regressions
        run: NODE_ENV=test node --import tsx --test test/recorder-matched-history.test.ts test/recorder-matched-outcome.test.ts test/rag-event-context-ladder.test.ts test/rag-event-context-ladder-view.test.ts test/rag-recorder-event-ladder-bridge.test.ts test/rag-recorded-spread-source-audit.test.ts test/recorded-replay-view.test.ts test/h1-replay-plan-audit.test.ts
      - name: Verify isolated archived Recorder preview guards
        run: NODE_ENV=test node --import tsx --test test/pr799-recorder-preview.test.ts test/pr799-browser-capture.test.ts test/h1-recorded-date-reader.test.ts
      - name: Verify patch whitespace
        run: git diff --check origin/main...HEAD
