name: RAG Event Evidence CI
on:
  pull_request:
    paths:
      - 'rag-event-evidence.ts'
      - 'rag-evidence-card.ts'
      - 'rag-question.ts'
      - 'premium-workspace-view.ts'
      - 'premium-workspace-model.ts'
      - 'dashboard-workspace-view.ts'
      - 'test/premium-recorded-workspace.test.ts'
      - 'market-book-view.ts'
      - 'business-dashboard-v1-view.ts'
      - 'research-router.ts'
      - 'h1-replay-http.ts'
      - 'h1-fixed-contract-journey-http.ts'
      - 'intraday-observation-memory.ts'
      - 'test/rag-event-evidence.test.ts'
      - 'test/rag-evidence-card.test.ts'
      - '.github/workflows/rag-event-evidence-ci.yml'
permissions:
  contents: read
jobs:
  read-only-evidence:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Exact evidence and existing reader regressions
        run: node --import tsx --test test/premium-recorded-workspace.test.ts test/rag-evidence-card.test.ts test/rag-event-evidence.test.ts test/intraday-observation-memory.test.ts test/h1-replay-http.test.ts test/h1-fixed-contract-journey-http.test.ts test/research-router-auth.test.ts test/market-book.test.ts test/market-book-strike-comparison.test.ts test/dashboard-reading-layout.test.ts test/data-reading-checklist.test.ts test/dashboard-refresh-mobile.test.ts
        env:
          NODE_ENV: test
