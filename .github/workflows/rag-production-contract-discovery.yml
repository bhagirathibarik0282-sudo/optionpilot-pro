name: RAG Recorded Contract Discovery CI
on:
  pull_request:
    paths:
      - 'test/rag-production-contract-discovery.test.ts'
      - '.github/workflows/rag-production-contract-discovery.yml'
  workflow_dispatch:
jobs:
  read-only-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock tsx
      - run: node --import tsx --test test/rag-production-contract-discovery.test.ts
