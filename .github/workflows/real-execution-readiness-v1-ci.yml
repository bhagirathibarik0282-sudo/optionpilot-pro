name: Real Execution Readiness V1 CI
on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:
jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node --import tsx --test test/real-execution-readiness-v1.test.ts test/kite-execution-shadow-v1.test.ts test/broker-execution-authorization.test.ts test/broker-order-builder.test.ts test/broker-order-reconciliation.test.ts
