name: Recorded dashboard and multi-day replay
on:
  pull_request:
    paths: ['recorded-*.ts', 'scripts/optionpilot-service-supervisor.mjs', 'test/recorded-*.test.ts', 'test/runtime-supervisor.test.ts', '.github/workflows/recorded-dashboard-replay-ci.yml']
permissions:
  contents: read
jobs:
  recorded-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: NODE_ENV=test node --import tsx --test test/recorded-playback.test.ts test/recorded-dashboard-http.test.ts test/recorded-dashboard-view.test.ts test/recorded-replay-view.test.ts test/runtime-supervisor.test.ts test/runtime-operating-window.test.ts test/runtime-io-tracker.test.ts
      - run: node scripts/optionpilot-guardrail-check.mjs
