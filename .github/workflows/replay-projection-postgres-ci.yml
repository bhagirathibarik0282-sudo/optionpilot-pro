name: Replay projection PostgreSQL CI
on:
  pull_request:
    branches: [main]
    paths:
      - 'db-startup-query.ts'
      - 'db.ts'
      - 'server.ts'
      - 'fii-dii-store.ts'
      - 'test/db-startup-query.test.ts'
      - 'h1-replay-canonical-projection.ts'
      - 'h1-replay-http.ts'
      - 'h1-replay-compact-v1.ts'
      - 'test/h1-replay-canonical-projection-pg.test.ts'
      - '.github/workflows/replay-projection-postgres-ci.yml'
  workflow_dispatch:
jobs:
  replay-projection-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: replay_test
          POSTGRES_PASSWORD: local_test_only
          POSTGRES_DB: replay_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U replay_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: NODE_ENV=test node --import tsx --test test/db-startup-query.test.ts test/h1-replay-canonical-projection-pg.test.ts test/h1-replay-compact-v1.test.ts test/h1-replay-http.test.ts
        env:
          TEST_REPLAY_DATABASE_URL: postgres://replay_test:local_test_only@localhost:5432/replay_test
