name: Research Mount Once

on:
  push:
    branches:
      - feature/research-intelligence-size-layer
    paths:
      - .github/workflows/research-mount-once.yml

permissions:
  contents: write

jobs:
  mount:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/research-intelligence-size-layer

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Verify safe mount markers
        run: npx tsx scripts/apply-research-server-mount.ts --dry-run

      - name: Apply research mount
        run: npx tsx scripts/apply-research-server-mount.ts

      - name: Verify only server.ts changed
        run: |
          changed="$(git diff --name-only)"
          echo "$changed"
          test "$changed" = "server.ts"

      - name: Commit mount to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts
          git commit -m "Mount research routes in server"
          git push origin HEAD:feature/research-intelligence-size-layer
