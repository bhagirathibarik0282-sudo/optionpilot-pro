name: Dashboard manual control CI
on:
  pull_request:
    paths:
      - 'scripts/runtime-control-panel.mjs'
      - 'scripts/optionpilot-service-supervisor.mjs'
      - 'runtime-operating-window.ts'
      - 'test/runtime-control-panel.test.mjs'
      - 'test/runtime-supervisor.test.ts'
      - 'package.json'
      - '.github/workflows/runtime-control-panel-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime-control:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run test:runtime-window
