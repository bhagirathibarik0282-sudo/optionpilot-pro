name: Seller Research Evidence Bridge CI
on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:
jobs:
  seller-research-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node --import tsx --test test/seller-vertical-economics-shadow.test.ts test/seller-research-evidence-bridge-v1.test.ts test/seller-step3-fail-closed.test.ts test/seller-kite-margin-proof-shadow.test.ts
