name: Seller Vertical Shadow Economics CI
on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:
jobs:
  seller-vertical-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: node --import tsx --test test/seller-vertical-economics-shadow.test.ts
