name: Shadow Contract Identity Atomic Claim CI

on:
  pull_request:
    branches: [automation-staging]
    paths:
      - shadow-contract-identity-claim-store.ts
      - shadow-contract-identity-persistence.ts
      - test/shadow-contract-identity-claim-store.test.ts
      - test/shadow-contract-identity-persistence.test.ts
      - .github/workflows/shadow-contract-identity-atomic-claim-ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: node --import tsx --test test/shadow-contract-identity-claim-store.test.ts test/shadow-contract-identity-persistence.test.ts
