name: Shadow Durable Broker Restart Provider CI

on:
  pull_request:
    branches: [automation-staging]

permissions:
  contents: read

jobs:
  provider:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: node --import tsx --test test/shadow-durable-broker-restart-provider.test.ts
