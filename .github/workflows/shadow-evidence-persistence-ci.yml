name: Shadow Evidence Persistence CI

on:
  pull_request:
    branches: [main]
    paths:
      - shadow-evidence-persistence.ts
      - test/shadow-evidence-persistence.test.ts
      - .github/workflows/shadow-evidence-persistence-ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: node --import tsx --test test/shadow-evidence-persistence.test.ts
