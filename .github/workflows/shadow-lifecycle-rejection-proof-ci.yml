name: Shadow Lifecycle Rejection Proof CI
on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node --import tsx --test test/shadow-lifecycle-rejection-proof.test.ts
