name: Shadow Postgres Restart Recovery E2E CI

on:
  pull_request:
    branches: [main, automation-staging]
    paths:
      - 'shadow-postgres-restart-recovery-e2e.ts'
      - 'shadow-replay-postgres-persistence.ts'
      - 'shadow-replay-postgres-store.ts'
      - 'shadow-replay-persistence-adapter.ts'
      - 'shadow-broker-state-recovery-guard.ts'
      - 'shadow-restart-recovery-coordinator.ts'
      - 'test/shadow-postgres-restart-recovery-e2e.test.ts'
      - '.github/workflows/shadow-postgres-restart-recovery-e2e-ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: node --import tsx --test test/shadow-postgres-restart-recovery-e2e.test.ts
