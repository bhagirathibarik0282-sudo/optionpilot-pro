name: Shadow Postgres Restart Runtime Adapter CI

on:
  pull_request:
    branches: [automation-staging]
    paths:
      - 'shadow-postgres-restart-runtime-adapter.ts'
      - 'test/shadow-postgres-restart-runtime-adapter.test.ts'
      - '.github/workflows/shadow-postgres-restart-runtime-adapter-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx --test test/shadow-postgres-restart-runtime-adapter.test.ts
