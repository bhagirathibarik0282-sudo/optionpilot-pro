name: Shadow Replay Postgres Store CI

on:
  pull_request:
    branches: [automation-staging]
    paths:
      - 'shadow-replay-postgres-store.ts'
      - 'shadow-replay-persistence-adapter.ts'
      - 'db.ts'
      - 'test/shadow-replay-postgres-store.test.ts'
      - '.github/workflows/shadow-replay-postgres-store-ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: node --import tsx --test test/shadow-replay-postgres-store.test.ts test/shadow-replay-persistence-adapter.test.ts
