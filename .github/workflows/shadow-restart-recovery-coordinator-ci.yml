name: Shadow Restart Recovery Coordinator CI

on:
  pull_request:
    branches:
      - main
      - automation-staging
    paths:
      - 'shadow-restart-recovery-coordinator.ts'
      - 'shadow-replay-persistence.ts'
      - 'shadow-broker-state-recovery-guard.ts'
      - 'test/shadow-restart-recovery-coordinator.test.ts'
      - '.github/workflows/shadow-restart-recovery-coordinator-ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: node --import tsx --test test/shadow-restart-recovery-coordinator.test.ts
