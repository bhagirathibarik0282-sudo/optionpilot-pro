name: Shadow Server Owned Replay Recovery Resolver CI

on:
  pull_request:
    branches: [automation-staging]
    paths:
      - 'shadow-server-owned-replay-recovery-resolver.ts'
      - 'test/shadow-server-owned-replay-recovery-resolver.test.ts'
      - '.github/workflows/shadow-server-owned-replay-recovery-resolver-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx tsx --test test/shadow-server-owned-replay-recovery-resolver.test.ts
