name: Shadow Startup Recovery Readonly Route Handler CI

on:
  pull_request:
    branches: [automation-staging]
    paths:
      - 'shadow-startup-recovery-readonly-route-handler.ts'
      - 'test/shadow-startup-recovery-readonly-route-handler.test.ts'
      - '.github/workflows/shadow-startup-recovery-readonly-route-handler-ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: node --import tsx --test test/shadow-startup-recovery-readonly-route-handler.test.ts
