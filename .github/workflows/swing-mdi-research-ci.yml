name: Swing MDI Research CI

on:
  pull_request:
    paths:
      - 'swing-mdi-research.ts'
      - 'test/swing-mdi-research.test.ts'
      - '.github/workflows/swing-mdi-research-ci.yml'

jobs:
  swing-mdi-research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run Swing MDI research tests
        run: NODE_ENV=test node --import tsx --test test/swing-mdi-research.test.ts
