name: Telegram Production Acceptance Proof CI

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  telegram-production-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node --import tsx --test test/canonical-telegram-production-acceptance-practical.test.ts
      - name: Read production meaningful preflight
        run: |
          curl -fsS 'https://optionpilot-pro-v2-production.up.railway.app/api/research/meaningful-live-acceptance?symbol=NIFTY'
          echo
          curl -fsS 'https://optionpilot-pro-v2-production.up.railway.app/api/research/meaningful-live-acceptance?symbol=SENSEX'
          echo
